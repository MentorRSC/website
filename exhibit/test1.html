const NT={en:['A pendulum swings back and forth in a smooth, regular rhythm. This is the science of motion.','Now we attach a second arm to the first. Two pendulums, one connected system.','Here are the first pivot, the first arm, the second pivot, and the second arm.','When released, the first arm swings and the second arm responds. Gravity turns potential energy into kinetic energy, and back again.','Now watch two identical double pendulums. Their starting positions differ by just one hundredth of a degree.','At first they move together. Then their paths drift completely apart. A tiny change, a completely different future.','On the left, regular repeating motion. On the right, chaotic motion that never repeats. This is chaos theory.','Can you predict its next move?','Three different starting positions. Three different futures.','Observe. Predict. Experiment. Welcome to the Regional Science Centre and Planetarium, Calicut.'],
ml:['ഒരു പെൻഡുലം സുഗമമായിയം ക്രമമായിയം ആടുന്നു. ഇതാണ് ചലനത്തിന്റെ ശാസ്ത്രം.','ഇനി ആദ്യത്തെ ദണ്ഡിനോട് രണ്ടാമതൊരു ദണ്ഡ് ചേർക്കുന്നു. രണ്ട് പെൻഡുലങ്ങൾ, ബന്ധിപ്പിച്ച ഒരു വ്യവസ്ഥ.','ഒന്നാം പിവറ്റ്, ഒന്നാം ദണ്ഡ്, രണ്ടാം പിവറ്റ്, രണ്ടാം ദണ്ഡ്.','വിടുമ്പോൾ ഒന്നാം ദണ്ഡ് ആടുന്നു, രണ്ടാം ദണ്ഡ് അതിനോട് പ്രതികരിക്കുന്നു. ഗുരുത്വാകർഷണം കാരണം സ്ഥിതികോർജ്ജം ഗതികോർജ്ജമായും തിരിച്ചും മാറുന്നു.','ഒരേപോലെയുള്ള രണ്ട് ഡബിൾ പെൻഡുലങ്ങളെ ശ്രദ്ധിക്കൂ. അവയുടെ തുടക്കം തമ്മിൽ വെറും നൂറിലൊരംശം ഡിഗ്രിയുടെ വ്യത്യാസം മാത്രം.','ആദ്യം അവ ഒരുപോലെ ചലിക്കുന്നു. പിന്നീട് പാതകൾ പൂർണ്ണമായി വേർപിരിയുന്നു. ചെറിയൊരു മാറ്റം, തികച്ചും വ്യത്യസ്തമായ ഭാവി.','ഇടതുവശത്ത് ക്രമമായ ആവർത്തന ചലനം, വലതുവശത്ത് ആവർത്തിക്കാത്ത അവ്യവസ്ഥിത ചലനം. ഇതാണ് കെയോസ് സിദ്ധാന്തം.','ഇതിന്റെ അടുത്ത ചലനം പ്രവചിക്കാമോ?','മൂന്ന് വ്യത്യസ്ത തുടക്കങ്ങൾ, മൂന്ന് വ്യത്യസ്ത ഭാവികൾ.','നിരീക്ഷിക്കുക. പ്രവചിക്കുക. പരീക്ഷിക്കുക. റീജിയണൽ സയൻസ് സെന്റർ ആൻഡ് പ്ലാനറ്റേറിയം, കോഴിക്കോട്.'],
hi:['एक लोलक सहज और नियमित लय में झूलता है। यही है गति का विज्ञान।','अब पहली भुजा से दूसरी भुजा जोड़ते हैं। दो लोलक, एक जुड़ी हुई प्रणाली।','पहला धुरी बिंदु, पहली भुजा, दूसरा धुरी बिंदु और दूसरी भुजा।','छोड़ने पर पहली भुजा झूलती है और दूसरी भुजा उस पर प्रतिक्रिया करती है। गुरुत्वाकर्षण के कारण स्थितिज ऊर्जा गतिज ऊर्जा में बदलती है और फिर वापस।','अब दो एक जैसे दोहरे लोलक देखिए। उनकी शुरुआती स्थिति में केवल एक डिग्री के सौवें हिस्से का अंतर है।','पहले वे साथ-साथ चलते हैं। फिर उनके रास्ते पूरी तरह अलग हो जाते हैं। एक छोटा बदलाव, बिल्कुल अलग भविष्य।','बाईं ओर नियमित, दोहराने वाली गति है, और दाईं ओर अव्यवस्थित गति। यही है केऑस सिद्धांत।','क्या आप इसकी अगली चाल बता सकते हैं?','तीन अलग शुरुआतें, तीन अलग भविष्य।','निरीक्षण करें। अनुमान लगाएँ। प्रयोग करें। रीजनल साइंस सेंटर एवं तारामंडल, कालीकट में आपका स्वागत है।']};
function say(s){const ss=window.speechSynthesis;if(!ss||muted)return;ss.cancel();const u=new SpeechSynthesisUtterance(s),lc=VL[LG],vc=ss.getVoices();u.lang=lc;const v=vc.find(x=>x.lang.replace('_','-')==lc)||vc.find(x=>x.lang.slice(0,2)==lc.slice(0,2));if(v)u.voice=v;u.rate=.92;ss.speak(u)}
function narrate(t){if(!started)return;let k=-1;NAR.forEach((c,j)=>{if(t>=c)k=j});if(k!==spoken){spoken=k;if(k>=0&&t-NAR[k]<4)say(NT[LG][k])}}
function setMute(m){muted=m;if(window._m)window._m.gain.value=m?0:.3;if(m&&window.speechSynthesis)speechSynthesis.cancel();$('#mu').textContent=m?'🔇':'🔊'}
const apply=()=>document.querySelectorAll('[data-k]').forEach(e=>e.textContent=tr(e.dataset.k));
function begin(){started=true;ended=false;t0=performance.now();cur=-1;lastCi=-1;nextArp=0;lastT=0;$('#end').style.display='none';spoken=-1;if(window.speechSynthesis)speechSynthesis.cancel();$('#bar').style.display='flex'}
function goHome(){started=false;ended=false;spoken=-1;if(window.speechSynthesis)speechSynthesis.cancel();$('#bar').style.display='none';$('#end').style.display='none';$('#go').style.display='flex';t0=performance.now();cur=-1}
function pick(l){LG=l;st.className=l;apply();['#ttl','#cap','#mid'].forEach(s=>$(s)._e=null);startAudio();AC.resume();if(muted)setMute(true);begin();$('#go').style.display='none';try{document.documentElement.requestFullscreen()}catch(x){}}
document.querySelectorAll('#go .bt').forEach(b=>b.onclick=e=>{e.stopPropagation();pick(b.dataset.l)});
$('#rep').onclick=e=>{e.stopPropagation();begin()};
$('#nxt').onclick=e=>{e.stopPropagation();NEXT_URL?location.href=NEXT_URL:goHome()};
apply();
addEventListener('keydown',e=>{if(e.key=='m')setMute(!muted)});
$('#mu').onclick=e=>{e.stopPropagation();setMute(!muted)};$('#hm').onclick=e=>{e.stopPropagation();goHome()};
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;let e=Math.max(0,(now-t0)/1000);if(started&&e>=LOOP-.2){if(!ended){ended=true;endAt=now;$('#end').style.display='flex'}e=LOOP-.2}const t=started?e:e%LOOP;music(ended?((now-t0)/1000)%LOOP:t,ended);if(ended&&now-endAt>45000)goHome();narrate(t);
 let i=0;while(i<B.length-2&&t>=B[i+1])i++;if(i!==cur){enter(i);cur=i}
 LQ.length=0;upd(i,t-B[i],dt,t);
 const k=snap?1:1-Math.exp(-dt*2.2);cam.position.lerp(want,k);tgt.lerp(wt,k);snap=false;cam.lookAt(tgt);cam.updateMatrixWorld();
 LB.forEach(l=>l.style.opacity=0);const v=new THREE.Vector3();
 LQ.forEach(([j,tx,c,wx,wy,o])=>{v.set(wx,wy,0).project(cam);const l=LB[j];l.textContent=tr(tx);l.className='lb '+c;l.style.left=(v.x*.5+.5)*100+'%';l.style.top=(-v.y*.5+.5)*100+'%';l.style.opacity=o});
 txt($('#ttl'),TOP,t);txt($('#cap'),CAP,t);txt($('#mid'),MID,t);
 $('#dim').style.opacity=.6*ease((t-81.6)/.8);
 const d=Math.min(...B.slice(0,-1).map(b=>Math.abs(t-b)),started?9:LOOP-t);$('#fade').style.opacity=Math.max(0,1-d/.45);
 R.render(sc,cam)}
requestAnimationFrame(loop);

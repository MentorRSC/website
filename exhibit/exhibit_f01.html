const NT={en:['Two tall columns of liquid, each with a different density and viscosity. Pressing the lever releases air bubbles at the bottom.','Watch the bubbles rise. They visibly get bigger as they climb.','Pressure in a liquid increases with depth. At the bottom, a bubble is squeezed by the whole weight of the liquid above it, plus the atmosphere.','As the bubble rises, the pressure falls. By Boyle’s law, lower pressure means a larger volume. A bubble at ten metres depth doubles in volume by the time it reaches the surface.','Buoyancy pushes the bubble up, and viscous drag resists. In the thick liquid, the drag is greater, so the bubble rises more slowly.','The same physics matters for scuba divers, who must breathe out as they ascend, for decompression sickness, and for fizzy drinks.','Lower pressure, bigger bubble.'],
ml:['ഓരോന്നിനും വ്യത്യസ്ത സാന്ദ്രതയും വിസ്കോസിറ്റിയുമുള്ള രണ്ട് ഉയരമുള്ള ദ്രാവക കോളങ്ങൾ. ലിവർ അമർത്തുമ്പോൾ അടിയിൽ നിന്ന് വായുക്കുമിളകൾ പുറത്തുവരുന്നു.','കുമിളകൾ ഉയരുന്നത് ശ്രദ്ധിക്കൂ. ഉയരുന്തോറും അവ വലുതാകുന്നത് കാണാം.','ദ്രാവകത്തിൽ ആഴം കൂടുംതോറും മർദ്ദം കൂടുന്നു. അടിയിൽ കുമിളയെ മുകളിലുള്ള ദ്രാവകത്തിന്റെ മുഴുവൻ ഭാരവും അന്തരീക്ഷവും ചേർന്ന് ഞെരുക്കുന്നു.','കുമിള ഉയരുമ്പോൾ മർദ്ദം കുറയുന്നു. ബോയിൽ നിയമമനുസരിച്ച് മർദ്ദം കുറഞ്ഞാൽ വ്യാപ്തം കൂടും. പത്ത് മീറ്റർ ആഴത്തിലെ കുമിള ഉപരിതലത്തിലെത്തുമ്പോൾ വ്യാപ്തം ഇരട്ടിയാകും.','ഉത്പ്ലവബലം കുമിളയെ മുകളിലേക്ക് തള്ളുന്നു, വിസ്കോസ് ഘർഷണം തടയുന്നു. കട്ടിയുള്ള ദ്രാവകത്തിൽ ഘർഷണം കൂടുതലായതിനാൽ കുമിള പതുക്കെ ഉയരുന്നു.','ഇതേ ഭൗതികശാസ്ത്രം സ്കൂബ ഡൈവർമാർക്ക് പ്രധാനമാണ്; മുകളിലേക്ക് വരുമ്പോൾ അവർ ശ്വാസം പുറത്തുവിടണം. ഡീകംപ്രഷൻ രോഗത്തിലും സോഡാ പാനീയങ്ങളിലും ഇതുതന്നെ പ്രവർത്തിക്കുന്നു.','മർദ്ദം കുറഞ്ഞാൽ കുമിള വലുതാകും.'],
hi:['तरल के दो ऊँचे स्तंभ, दोनों का घनत्व और श्यानता अलग। लीवर दबाने पर नीचे से हवा के बुलबुले निकलते हैं।','बुलबुलों को ऊपर उठते देखिए। ऊपर चढ़ते हुए वे साफ़ तौर पर बड़े होते जाते हैं।','तरल में गहराई के साथ दबाव बढ़ता है। सबसे नीचे बुलबुले पर ऊपर के पूरे तरल का भार और वायुमंडल का दबाव पड़ता है।','जैसे-जैसे बुलबुला ऊपर उठता है, दबाव घटता है। बॉयल के नियम के अनुसार कम दबाव का मतलब बड़ा आयतन। दस मीटर की गहराई का बुलबुला सतह तक पहुँचते-पहुँचते अपना आयतन दोगुना कर लेता है।','उत्प्लावन बल बुलबुले को ऊपर धकेलता है और श्यान अवरोध उसे रोकता है। गाढ़े तरल में अवरोध ज़्यादा है, इसलिए बुलबुला धीरे ऊपर उठता है।','यही भौतिकी स्कूबा गोताखोरों के लिए ज़रूरी है, जिन्हें ऊपर आते समय साँस छोड़नी होती है, साथ ही डिकंप्रेशन बीमारी और सोडा पेय में भी।','दबाव घटे, तो बुलबुला बढ़े।']},VL={en:'en-IN',ml:'ml-IN',hi:'hi-IN'};

const txt=(el,arr,t)=>{const e=arr.find(a=>t>=a[0]&&t<a[1]);if(!e){el.style.opacity=0;return}if(el._e!==e){el.innerHTML=tr(e[2])+(el.id=='mid'?'<small>'+tr(SUB)+'</small>':'');el._e=e}el.style.opacity=Math.min(1,(t-e[0])/.6,(e[1]-t)/.6)};

function tone(f,t,d,v,type,a){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.1)}
function startAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();const m=AC.createGain();m.gain.value=0;m.gain.linearRampToValueAtTime(.3,AC.currentTime+3);m.connect(AC.destination);
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;bus=AC.createGain();bus.connect(lp);lp.connect(m);
 const dl=AC.createDelay(1);dl.delayTime.value=.4;const fb=AC.createGain();fb.gain.value=.4;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(m);window._m=m}
function music(t,calm){if(!AC||AC.state!='running')return;if(t<lastT-1){lastCi=-1;nextArp=0}lastT=t;const n=AC.currentTime,cd=LOOP/16,ci=Math.floor(t/cd);
 if(ci!==lastCi){lastCi=ci;const c=CHD[ci%4];c.slice(0,3).forEach(f=>{tone(f,n,cd+1.5,.07,'triangle',1.6);tone(f*1.004,n,cd+1.5,.05,'sine',1.8)});tone(c[3],n,cd+1,.16,'sine',.8)}
 if(!calm&&t>=nextArp&&t>8&&t<70){const c=CHD[ci%4];nextArp=t+.5+Math.random()*.5;tone(c[Math.floor(Math.random()*3)]*4,n,.5,.03,'sine',.01)}}
function say(s){const ss=window.speechSynthesis;if(!ss||muted)return;ss.cancel();const u=new SpeechSynthesisUtterance(s),lc=VL[LG],vc=ss.getVoices();u.lang=lc;const v=vc.find(x=>x.lang.replace('_','-')==lc)||vc.find(x=>x.lang.slice(0,2)==lc.slice(0,2));if(v)u.voice=v;u.rate=.92;ss.speak(u)}

 if(i==2)LIQ.forEach((c,k)=>[0,5,10].forEach((d,j)=>lab(k*3+j,d+' m · '+(1+c.rho*G*d/P0).toFixed(2)+' atm','p',c.x*2.13,YB+9-d*U)));
 let ro='';
 LIQ.forEach((c,k)=>{const b=c.tr;c.sp.material.opacity=b&&i>=2&&i<=4?.9:0;if(b){c.sp.position.copy(b.m.position);c.sp.scale.setScalar(.13*b.ratio*7)}
  if(i>=2&&i<=4)ro+=c.n+' · P '+(b?(b.P/P0).toFixed(2):'–')+' atm · V ×'+(b?(c.Pb/b.P).toFixed(2):'–')+'<br>';
  arr[k].forEach((a,j)=>{a.visible=!!b&&i==4;if(a.visible){const L=.55*(c.Pb/b.P)*(c.rho/1000);a.position.set(c.x+(j?.45:-.45),b.m.position.y+(j?-.1:.1),.6);a.setDirection(new THREE.Vector3(0,j?-1:1,0));a.setLength(L,.3,.2)}})});
 const ro_=$('#ro');if(ro){ro_.innerHTML=ro;ro_.style.opacity=1}else ro_.style.opacity=0;
 const z=i==0?17+2*(1-ease(lt/6)):17;cam.position.set(Math.sin(t*.15)*.4,-.3,z);cam.lookAt(tgt)}

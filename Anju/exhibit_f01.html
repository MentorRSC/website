<script>

const q=new URLSearchParams(location.search).get('lang');
window.LANG=['en','ml','hi'].includes(q)?q:(LS.getItem('lang')||'en');
if(q)LS.setItem('lang',q);
const TX={
 tabs:{en:['Explanation','Video','Links'],ml:['വിശദീകരണം','വീഡിയോ','ലിങ്കുകൾ'],hi:['व्याख्या','वीडियो','लिंक']},

 tag:{en:'Why do bubbles grow as they climb?',ml:'കുമിളകൾ ഉയരുമ്പോൾ വലുതാകുന്നത് എന്തുകൊണ്ട്?',hi:'बुलबुले ऊपर जाते हुए बड़े क्यों होते हैं?'},

/* ===== EDIT HERE: explanation text (paragraphs; the last one is the "try it" note) ===== */
const EXP={
 en:["Bubbles rising through the liquid grow bigger as they near the top, even though the air inside them never changes.","The reason is pressure. In a liquid, pressure rises with depth: P = P₀ + ρgh. Every ten metres of water adds about one atmosphere.","As a bubble climbs, the pressure on it drops. By Boyle’s law (P₁V₁ = P₂V₂), lower pressure means larger volume. A bubble at 30 m (4 atm) becomes four times larger at the surface.","Buoyancy, the upward force ρVg from Archimedes’ principle, pushes it up. Liquid drag pulls back, so bubbles rise slowly in thick liquids.","Try it: press the lever and compare the thin and thick liquid columns. Divers use the same idea: they breathe out as they come up."],
 ml:["ദ്രാവകത്തിലൂടെ ഉയരുന്ന കുമിളകൾ മുകളിലെത്തുമ്പോൾ വലുതാകുന്നു; ഉള്ളിലെ വായുവിന്റെ അളവ് മാറുന്നില്ലെങ്കിലും.","കാരണം മർദ്ദമാണ്. ആഴം കൂടുന്തോറും മർദ്ദം കൂടുന്നു: P = P₀ + ρgh. ഓരോ പത്ത് മീറ്റർ വെള്ളവും ഏകദേശം ഒരു അന്തരീക്ഷമർദ്ദം കൂട്ടുന്നു.","കുമിള ഉയരുമ്പോൾ മർദ്ദം കുറയുന്നു. ബോയിൽ നിയമപ്രകാരം (P₁V₁ = P₂V₂) മർദ്ദം കുറഞ്ഞാൽ വ്യാപ്തം കൂടും. 30 മീറ്ററിലെ (4 atm) കുമിള ഉപരിതലത്തിൽ നാലിരട്ടി വലുതാകും.","ആർക്കിമിഡീസ് തത്വത്തിലെ പ്ലവക്ഷമബലം (ρVg) കുമിളയെ മുകളിലേക്ക് തള്ളുന്നു. ദ്രാവകത്തിന്റെ വലിവ് പിന്നോട്ട് വലിക്കുന്നതിനാൽ കട്ടിയുള്ള ദ്രാവകത്തിൽ കുമിളകൾ പതുക്കെ ഉയരുന്നു.","പരീക്ഷിക്കൂ: ലിവർ അമർത്തി നേർത്തതും കട്ടിയുള്ളതുമായ കുഴലുകൾ താരതമ്യം ചെയ്യുക. മുങ്ങൽ വിദഗ്ധർ ഉയരുമ്പോൾ ശ്വാസം പുറത്തുവിടുന്നതും ഇതേ തത്വം കൊണ്ടാണ്."],
 hi:["तरल में ऊपर उठते बुलबुले सतह के पास पहुँचते-पहुँचते बड़े हो जाते हैं, जबकि उनके अंदर की हवा की मात्रा नहीं बदलती।","इसका कारण दाब है। गहराई के साथ दाब बढ़ता है: P = P₀ + ρgh। हर दस मीटर पानी लगभग एक वायुमंडलीय दाब जोड़ता है।","बुलबुला ऊपर चढ़ता है तो उस पर दाब घटता है। बॉयल के नियम (P₁V₁ = P₂V₂) के अनुसार कम दाब पर आयतन बढ़ता है। 30 मीटर (4 atm) पर बना बुलबुला सतह पर चार गुना बड़ा हो जाता है।","आर्किमिडीज़ के सिद्धांत का उत्प्लावन बल (ρVg) बुलबुले को ऊपर धकेलता है। तरल का अवरोध उसे पीछे खींचता है, इसलिए गाढ़े तरल में बुलबुले धीमे उठते हैं।","आज़माइए: लीवर दबाएँ और पतले व गाढ़े तरल वाले स्तंभों की तुलना करें। गोताखोर भी ऊपर आते समय साँस छोड़ते हैं, यही सिद्धांत है।"]};
/* ===== EDIT HERE: external links ===== */
const LINKS=[
 ['https://en.wikipedia.org/wiki/Boyle%27s_law',{en:"Boyle’s law",ml:'ബോയിൽ നിയമം',hi:'बॉयल का नियम'}],
 ['https://en.wikipedia.org/wiki/Hydrostatic_pressure',{en:'Hydrostatic pressure',ml:'ദ്രവസ്ഥിത മർദ്ദം',hi:'द्रवस्थैतिक दाब'}],
 ['https://en.wikipedia.org/wiki/Buoyancy',{en:'Buoyancy',ml:'പ്ലവക്ഷമബലം',hi:'उत्प्लावन बल'}],

<script>
const S=[
{t:0,en:"Welcome to Rising Bubbles. Press the lever and air bubbles rise through the liquid. Notice something curious: they get bigger as they climb.",ml:"ഉയരുന്ന കുമിളകളിലേക്ക് സ്വാഗതം. ലിവർ അമർത്തുമ്പോൾ ദ്രാവകത്തിലൂടെ വായുകുമിളകൾ ഉയരുന്നു. അവ മുകളിലേക്ക് പോകുമ്പോൾ വലുതാകുന്നു."},
{t:10,en:"Near the bottom the bubbles are small. Near the top they are clearly larger. The amount of air inside has not changed, so what is making them grow? The answer is pressure.",ml:"അടിയിൽ കുമിളകൾ ചെറുതാണ്, മുകളിൽ വലുതും. ഉള്ളിലെ വായുവിന്റെ അളവ് മാറുന്നില്ല. പിന്നെ എന്താണ് വലുതാക്കുന്നത്? മർദ്ദം."},
{t:26,en:"In a liquid, pressure increases with depth: P equals P-naught plus rho g h. Every ten metres of water adds about one atmosphere. A deep bubble is squeezed hard by all the liquid above it.",ml:"ദ്രാവകത്തിൽ ആഴം കൂടുന്തോറും മർദ്ദം കൂടുന്നു: P = P₀ + ρgh. ഓരോ പത്ത് മീറ്റർ വെള്ളവും ഏകദേശം ഒരു അന്തരീക്ഷമർദ്ദം കൂട്ടുന്നു. ആഴത്തിലെ കുമിളയെ മുകളിലെ ദ്രാവകം ശക്തമായി ഞെരുക്കുന്നു."},
{t:46,en:"As the bubble rises, the pressure around it falls. By Boyle’s law, P1 V1 equals P2 V2, so lower pressure means larger volume. At four atmospheres the bubble has volume V. At two it is twice as big. At the surface, four times.",ml:"കുമിള ഉയരുമ്പോൾ ചുറ്റുമുള്ള മർദ്ദം കുറയുന്നു. ബോയിൽ നിയമമനുസരിച്ച് P₁V₁ = P₂V₂; മർദ്ദം കുറഞ്ഞാൽ വ്യാപ്തം കൂടും. 4 atm-ൽ വ്യാപ്തം V ആണെങ്കിൽ 2 atm-ൽ ഇരട്ടി, ഉപരിതലത്തിൽ നാലിരട്ടി."},
{t:66,en:"The graph shows volume against depth. Notice the curve is steepest near the surface. A bubble at ten metres doubles in volume on reaching the top, because pressure drops from two atmospheres to one.",ml:"ഗ്രാഫ് ആഴത്തിനനുസരിച്ച് വ്യാപ്തം കാണിക്കുന്നു. ഉപരിതലത്തിനടുത്താണ് വളവ് ഏറ്റവും കുത്തനെ. 10 മീറ്ററിലെ കുമിള മുകളിലെത്തുമ്പോൾ 2 atm-ൽ നിന്ന് 1 atm-ലേക്ക് മർദ്ദം കുറയുന്നതിനാൽ വ്യാപ്തം ഇരട്ടിയാകും."},
{t:84,en:"Why does it rise at all? Buoyancy. By Archimedes’ principle the upward force equals rho V g. As the bubble grows, buoyancy grows. Liquid drag pulls back, and the bubble settles at the speed where the two balance.",ml:"എന്തുകൊണ്ട് ഉയരുന്നു? പ്ലവക്ഷമബലം. ആർക്കിമിഡീസ് തത്വമനുസരിച്ച് മുകളിലേക്കുള്ള ബലം ρVg ആണ്. കുമിള വലുതാകുമ്പോൾ ബലം കൂടുന്നു. ദ്രാവകത്തിന്റെ വലിവ് പിന്നോട്ട് വലിക്കുന്നു; ഇവ സന്തുലിതമാകുന്ന വേഗതയിൽ കുമിള ഉയരുന്നു."},
{t:100,en:"The two columns differ in density and viscosity. In a thin liquid bubbles rush upward. In a thick, viscous liquid, drag is larger and they rise slowly.",ml:"രണ്ട് കുഴലുകളിലും സാന്ദ്രതയും ശ്യാനതയും വ്യത്യസ്തമാണ്. നേർത്ത ദ്രാവകത്തിൽ കുമിളകൾ വേഗത്തിൽ ഉയരുന്നു; കട്ടിയുള്ളതിൽ വലിവ് കൂടുതലായതിനാൽ പതുക്കെ."},
{t:110,en:"The same physics protects divers, who must exhale while ascending. It explains the bends, fizzy drinks and industrial bubble reactors. Lower pressure, bigger bubble.",ml:"ഇതേ തത്വം മുങ്ങൽ വിദഗ്ധർക്ക് ഉയരുമ്പോൾ ശ്വാസം പുറത്തുവിടേണ്ടതിന്റെ കാരണമാണ്. ഡീകംപ്രഷൻ സിക്ക്നസ്, സോഡ, വ്യവസായ ബബിൾ റിയാക്ടറുകൾ എന്നിവയിലും ഇത് കാണാം. മർദ്ദം കുറഞ്ഞാൽ കുമിള വലുതാകും."}];

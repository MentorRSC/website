<style>
:root{--bg:#0b1d2a;--pn:#14303f;--ln:#2b5870;--fg:#e8f1f5;--mut:#9db6c2;--ac:#f2a65a;--aq:#8fc7e0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050e15;color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Malayalam","Noto Sans Devanagari",sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{position:relative;margin:0 auto;overflow:hidden;background:var(--bg);width:100vw;height:100dvh}
@media(min-width:700px){.app{width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));box-shadow:0 0 0 1px var(--ln),0 30px 80px #000;margin-top:max(0px,calc((100dvh - min(100dvh,calc(100vw*16/9)))/2))}}
.view{position:absolute;inset:0;display:none;flex-direction:column;opacity:0}
.app[data-view=intro] #intro,.app[data-view=home] #home,.app[data-view=gallery] #gallery{display:flex;animation:in .5s forwards}
@keyframes in{to{opacity:1}}
h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Noto Serif Malayalam","Noto Serif Devanagari",serif;font-weight:600;margin:0}
.stars{position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 20% 15%,#fff,transparent),radial-gradient(1px 1px at 70% 25%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 8%,#cfe,transparent),radial-gradient(1px 1px at 40% 40%,#fff,transparent),radial-gradient(1px 1px at 10% 55%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 60%,#fff9,transparent);animation:tw 5s ease-in-out infinite alternate;pointer-events:none}
@keyframes tw{from{opacity:.4}to{opacity:1}}
/* intro */
#intro{justify-content:center;align-items:center;padding:28px;text-align:center;gap:10px}
#intro .logo{width:84px;height:84px;margin-bottom:8px}
#intro h1{font-size:clamp(22px,6.4vw,32px);line-height:1.2}
#intro p{color:var(--mut);margin:4px 0 22px;font-size:15px}
.lang{width:100%;max-width:300px;display:flex;justify-content:space-between;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px 20px;font-size:20px;margin-top:10px;transition:.2s}
.lang small{color:var(--mut);font-size:13px}
.lang:active,.lang:hover{border-color:var(--ac);transform:translateY(-1px)}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px;position:relative;z-index:3}
.pill{background:#14303fcc;border:1px solid var(--ln);border-radius:20px;height:36px;min-width:36px;padding:0 13px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;backdrop-filter:blur(6px)}
.pill.on{border-color:var(--ac);color:var(--ac)}
.row{display:flex;gap:8px}
/* home */
.scroll{flex:1;overflow-y:auto;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));position:relative;z-index:2}
.hero{text-align:center;padding:4px 0 6px}
.hero svg{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
.hero h1{font-size:clamp(23px,6.6vw,31px);line-height:1.2;margin-top:6px}
.hero p{margin:8px 0 0;color:var(--aq);font-size:15px;letter-spacing:.02em}
h2{font-size:17px;color:var(--mut);font-weight:500;margin:22px 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g{position:relative;background:linear-gradient(160deg,var(--pn),#0f2635);border:1px solid var(--ln);border-radius:18px;padding:16px 14px;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s;overflow:hidden}
.g:last-child{grid-column:1/-1;min-height:96px}
.g:active,.g:hover{border-color:var(--ac);transform:translateY(-2px)}
.g .ic{font-size:30px;line-height:1}
.g b{font-size:16px;font-weight:600;display:block}
.g span{font-size:12.5px;color:var(--mut)}
.g::after{content:"";position:absolute;right:-26px;top:-26px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.18}
/* gallery list */
.ghead{padding:6px 20px 14px;position:relative;z-index:2}
.ghead h1{font-size:26px;display:flex;align-items:center;gap:10px}
.ghead p{margin:4px 0 0;color:var(--mut);font-size:14px}
.item{margin-bottom:12px;min-height:84px}
.card{display:flex;align-items:center;gap:14px;background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:12px;text-decoration:none;color:inherit;transition:.2s}
.card:active,.card:hover{border-color:var(--ac)}
.code{flex:none;width:58px;height:58px;border-radius:14px;background:var(--bg);border:1px solid var(--ln);display:grid;place-items:center;color:var(--ac);font-weight:700;font-size:15px}
.card b{display:block;font-size:16.5px;font-weight:600}
.card span{display:block;color:var(--mut);font-size:13px;margin-top:3px;line-height:1.35}
.card i{margin-left:auto;color:var(--aq);font-style:normal;font-size:20px}
.sk{display:flex;align-items:center;gap:14px;background:var(--pn);border-radius:16px;padding:12px;height:84px}
.sk>div:first-child{width:58px;height:58px;border-radius:14px}
.sk>div:last-child{flex:1;display:grid;gap:9px}
.sk i{display:block;height:12px;border-radius:6px}
.sk i:last-child{width:60%}
.sk>div:first-child,.sk i{background:linear-gradient(90deg,#1b3e50 25%,#26536a 50%,#1b3e50 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.reveal{animation:in .5s forwards;opacity:0}
.empty{color:var(--mut);text-align:center;padding:40px 10px;line-height:1.5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.view,.reveal{opacity:1}}
.mwrap{position:relative}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;height:4px;background:currentColor;border-radius:2px}
.pill.on .eq i{animation:eq .9s infinite ease-in-out alternate}
.eq i:nth-child(2){animation-delay:.25s!important}.eq i:nth-child(3){animation-delay:.5s!important}
@keyframes eq{to{height:14px}}
.menu{position:absolute;left:0;top:46px;width:min(286px,calc(100vw - 36px));background:#0f2635f2;backdrop-filter:blur(16px);border:1px solid var(--ln);border-radius:20px;padding:16px;box-shadow:0 20px 44px #000b;display:none;transform-origin:top left}
.menu.open{display:block;animation:pop .22s}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-6px)}}
.menu h3{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--mut)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.mode{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;border-radius:14px;border:1px solid var(--ln);background:var(--bg);font-size:12px;text-align:center;line-height:1.2;transition:.2s}
.mode span{font-size:20px}
.mode.sel{border-color:var(--ac);background:#f2a65a1c}
.trk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 8px;border-radius:12px;font-size:15px;transition:.2s}
.trk .d{width:28px;height:28px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;font-size:11px;color:var(--mut);flex:none}
.trk.sel{background:#8fc7e01a}.trk.sel .d{background:var(--ac);border-color:var(--ac);color:#1a1208}
.trk small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
</style></head><body>
<div class="app" id="app" data-view="intro">

<section class="view" id="intro"><div class="stars"></div>
 <svg class="logo" viewBox="0 0 100 100" fill="none" stroke="#f2a65a" stroke-width="3"><circle cx="50" cy="50" r="34"/><ellipse cx="50" cy="50" rx="46" ry="14" transform="rotate(-22 50 50)" stroke="#8fc7e0"/><circle cx="50" cy="50" r="9" fill="#f2a65a" stroke="none"/></svg>
 <h1>Choose your language<br>ഭാഷ തിരഞ്ഞെടുക്കുക<br>भाषा चुनें</h1>
 <p>&nbsp;</p>
 <button class="lang" data-l="en">English <small>EN</small></button>

</section>

<section class="view" id="home"><div class="stars"></div>
 <div class="bar"><div class="mwrap"><button class="pill" id="mus" aria-label="Music"><span class="eq"><i></i><i></i><i></i></span><span id="musT"></span> ▾</button><div class="menu" id="menu"></div></div><button class="pill" id="lg" aria-label="Language"></button></div>
 <div class="scroll">
  <div class="hero">
   <svg viewBox="0 0 330 150" fill="none"><path d="M45 120a120 100 0 0 1 240 0z" fill="#14303f" stroke="#2b5870" stroke-width="2"/><path d="M85 120a80 66 0 0 1 160 0M125 120a40 36 0 0 1 80 0M165 54v66" stroke="#2b5870" stroke-width="1.5"/><circle cx="238" cy="40" r="13" fill="#f2a65a"/><ellipse cx="238" cy="40" rx="24" ry="5" stroke="#8fc7e0" stroke-width="2" transform="rotate(-20 238 40)"/><path d="M20 120h290" stroke="#2b5870" stroke-width="2"/><g fill="#fff"><circle cx="60" cy="30" r="1.8"/><circle cx="110" cy="15" r="1.3"/><circle cx="185" cy="22" r="1.6"/><circle cx="290" cy="85" r="1.3"/></g></svg>
   <h1 id="t1"></h1><p id="t2"></p>
  </div>
  <h2 id="t3"></h2>
  <div class="grid" id="grid"></div>
 </div>
</section>

<section class="view" id="gallery">
 <div class="bar"><button class="pill" id="back">‹ <span id="backT"></span></button><button class="pill" id="lg2"></button></div>
 <div class="ghead"><h1 id="gt"></h1><p id="gs"></p></div>
 <div class="scroll" id="list"></div>
</section>
</div>

<script>
/* ============ EDIT HERE: galleries & exhibits ============
   Add an exhibit: copy a line into the gallery's list, make a page named file (e.g. exhibit_f02.html). */
const GAL=[
 {k:'f',ic:'🧪',c:'#f2a65a',n:{en:'Fun Science',ml:'ഫൺ സയൻസ്',hi:'फन साइंस'}},
 {k:'a',ic:'🔭',c:'#8f7cf2',n:{en:'Astronomy',ml:'ജ്യോതിശാസ്ത്രം',hi:'खगोल विज्ञान'}},
 {k:'o',ic:'🌊',c:'#4aa8d8',n:{en:'Ocean Gallery',ml:'സമുദ്ര ഗാലറി',hi:'महासागर गैलरी'}},
 {k:'m',ic:'🪞',c:'#7fd6c2',n:{en:'Mirror Gallery',ml:'കണ്ണാടി ഗാലറി',hi:'दर्पण गैलरी'}},
 {k:'p',ic:'🌳',c:'#8fd16a',n:{en:'Science Park',ml:'സയൻസ് പാർക്ക്',hi:'विज्ञान उद्यान'}}];
const EX={
 f:[{id:'f01',file:'exhibit_f01.html',n:{en:'Rising Bubbles',ml:'ഉയരുന്ന കുമിളകൾ',hi:'ऊपर उठते बुलबुले'},d:{en:'Why do bubbles grow as they climb?',ml:'കുമിളകൾ ഉയരുമ്പോൾ വലുതാകുന്നത് എന്തുകൊണ്ട്?',hi:'बुलबुले ऊपर जाते हुए बड़े क्यों होते हैं?'}}],
 a:[],o:[],m:[],p:[]};
/* ========================================================= */
const TX={
 t1:{en:'Regional Science Centre & Planetarium',ml:'റീജിയണൽ സയൻസ് സെന്റർ & പ്ലാനറ്റേറിയം',hi:'क्षेत्रीय विज्ञान केंद्र एवं तारामंडल'},
 t2:{en:'Calicut',ml:'കോഴിക്കോട്',hi:'कालीकट'},
 t3:{en:'Explore the galleries',ml:'ഗാലറികൾ കാണാം',hi:'गैलरियाँ देखें'},
 back:{en:'Home',ml:'ഹോം',hi:'होम'},
 ex:{en:'exhibits',ml:'പ്രദർശനങ്ങൾ',hi:'प्रदर्शनियाँ'},
 soon:{en:'Exhibits for this gallery are coming soon.',ml:'ഈ ഗാലറിയിലെ പ്രദർശനങ്ങൾ ഉടൻ എത്തും.',hi:'इस गैलरी की प्रदर्शनियाँ जल्द आ रही हैं।'},
 lg:{en:'EN',ml:'മല',hi:'हि'},
 mus:{en:'Music',ml:'സംഗീതം',hi:'संगीत'},
 mh:{en:'Playback mode',ml:'പ്ലേബാക്ക് മോഡ്',hi:'प्लेबैक मोड'},
 th:{en:'Melodies',ml:'ഗാനങ്ങൾ',hi:'धुनें'},
 md:{shuffle:{en:'Shuffle loop',ml:'ഷഫിൾ ലൂപ്പ്',hi:'शफल लूप'},one:{en:'Repeat one',ml:'ഒരെണ്ണം ആവർത്തിക്കുക',hi:'एक दोहराएँ'},off:{en:'Music off',ml:'സംഗീതം ഓഫ്',hi:'संगीत बंद'}}};
const $=id=>document.getElementById(id),app=$('app'),LS=(()=>{try{return localStorage}catch(e){return {getItem(){},setItem(){}}}})();
let lang=LS.getItem('lang')||'en',cur=null,musicOn=false;
const ORDER=['en','ml','hi'];
function view(v){app.dataset.view=v}
function render(){
 document.documentElement.lang=lang;
 ['t1','t2','t3'].forEach(k=>$(k).textContent=TX[k][lang]);
 $('lg').textContent=$('lg2').textContent=TX.lg[lang];$('backT').textContent=TX.back[lang];renderMenu();
 $('grid').innerHTML=GAL.map(g=>`<button class="g" data-k="${g.k}" style="--c:${g.c}"><span class="ic">${g.ic}</span><div><b>${g.n[lang]}</b><span>${EX[g.k].length} ${TX.ex[lang]}</span></div></button>`).join('');
 if(cur)openGallery(cur,true)}
function setLang(l){lang=l;LS.setItem('lang',l);render()}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{setLang(b.dataset.l);LS.setItem('seen','1');view('home');music(true)});
[ 'lg','lg2'].forEach(i=>$(i).onclick=()=>setLang(ORDER[(ORDER.indexOf(lang)+1)%3]));
$('grid').onclick=e=>{const b=e.target.closest('.g');if(b){openGallery(b.dataset.k);history.replaceState(null,'','#'+b.dataset.k)}};
$('back').onclick=()=>{cur=null;view('home');history.replaceState(null,'','#home')};
function openGallery(k,keep){
 cur=k;const g=GAL.find(x=>x.k==k),list=EX[k];
 $('gt').textContent=g.ic+' '+g.n[lang];$('gs').textContent=list.length+' '+TX.ex[lang];
 const L=$('list');L.scrollTop=0;
 if(!list.length){L.innerHTML=`<div class="empty">${TX.soon[lang]}</div>`}
 else{L.innerHTML=list.map(()=>`<div class="item"><div class="sk"><div></div><div><i></i><i></i></div></div></div>`).join('');
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;io.unobserve(en.target);const i=[...L.children].indexOf(en.target),x=list[i];
   setTimeout(()=>{en.target.innerHTML=`<a class="card reveal" href="${x.file}"><div class="code">${x.id}</div><div><b>${x.n[lang]}</b><span>${x.d[lang]}</span></div><i>›</i></a>`},keep?60:450+i*90)}),{root:L,threshold:.1});
  [...L.children].forEach(c=>io.observe(c))}
 view('gallery')}
/* ===== background music: three light melodies generated in the browser (no audio files) =====
   EDIT HERE: n = names, bpm = speed, m = melody (semitones above middle C, -1 = rest, one per beat), b = bass note per 4 beats */
const TR=[
 {n:{en:'Morning Light',ml:'പ്രഭാതകിരണം',hi:'सुबह की किरण'},bpm:84,m:[0,4,7,12,9,7,4,7, 2,5,9,14,12,9,5,9, 4,7,11,16,14,11,7,11, 12,9,7,4,7,4,2,0],b:[-12,-10,-8,-12,-12,-10,-8,-12]},
 {n:{en:'Starlit Waltz',ml:'നക്ഷത്രനൃത്തം',hi:'तारों की धुन'},bpm:72,m:[7,12,16,-1,14,12,9,-1, 7,11,14,-1,12,11,7,-1, 5,9,12,-1,14,12,9,-1, 7,11,14,12,11,7,4,0],b:[-5,-5,-7,-5,-7,-5,-12,-12]},
 {n:{en:'Ocean Breeze',ml:'സമുദ്രക്കാറ്റ്',hi:'सागर की हवा'},bpm:66,m:[4,7,9,7,4,2,0,2, 4,9,12,9,7,4,2,4, 5,9,12,14,12,9,5,9, 7,4,2,0,2,4,7,4],b:[-8,-8,-7,-12,-7,-8,-5,-12]}];
let AC,master,dly,tm,mode=LS.getItem('mmode')||'shuffle',ti=+LS.getItem('mtrack')||0,ni=0,nextT=0;
const hz=n=>261.63*Math.pow(2,n/12);
function ac(){if(AC)return true;const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;AC=new C();master=AC.createGain();master.gain.value=0;
 dly=AC.createDelay(1);dly.delayTime.value=.36;const fb=AC.createGain();fb.gain.value=.38;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
 dly.connect(lp);lp.connect(fb);fb.connect(dly);lp.connect(master);master.connect(AC.destination);return true}
function pluck(f,t,d,v){const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+d);
 [['sine',1,1],['triangle',2,.18]].forEach(([ty,m,a])=>{const o=AC.createOscillator(),x=AC.createGain();o.type=ty;o.frequency.value=f*m;x.gain.value=a;o.connect(x);x.connect(g);o.start(t);o.stop(t+d+.05)});
 g.connect(master);g.connect(dly)}
function tick(){const T=TR[ti],beat=60/T.bpm;
 while(nextT<AC.currentTime+.35){const n=T.m[ni];
  if(n>=0)pluck(hz(n),nextT,beat*2.2,.22);
  if(ni%4==0)pluck(hz(T.b[ni/4]),nextT,beat*3.5,.2);
  nextT+=beat;ni++;
  if(ni>=T.m.length){ni=0;nextT+=beat*2;if(mode=='shuffle'){let k;do{k=Math.floor(Math.random()*TR.length)}while(k==ti);ti=k;LS.setItem('mtrack',ti);renderMenu()}return tick()}}}
function start(){if(!ac())return;AC.resume();ni=0;nextT=AC.currentTime+.2;clearInterval(tm);tm=setInterval(tick,120);master.gain.cancelScheduledValues(AC.currentTime);master.gain.setTargetAtTime(.42,AC.currentTime,.6)}
function stop(){if(!AC)return;master.gain.setTargetAtTime(0,AC.currentTime,.3);clearInterval(tm)}
function music(on){musicOn=on&&mode!='off';$('mus').classList.toggle('on',musicOn);if(musicOn)start();else stop()}
function setMode(m){mode=m;LS.setItem('mmode',m);if(m=='shuffle'&&!musicOn)music(true);else music(m!='off');renderMenu()}
function pick(i){ti=i;LS.setItem('mtrack',i);mode='one';LS.setItem('mmode','one');if(musicOn){stop();setTimeout(()=>{music(true)},350)}else music(true);renderMenu()}
function renderMenu(){const mi={shuffle:'🔀',one:'🔂',off:'🔇'};
 $('musT').textContent=TX.mus[lang];
 $('menu').innerHTML=`<h3>${TX.mh[lang]}</h3><div class="modes">${['shuffle','one','off'].map(m=>`<button class="mode ${mode==m?'sel':''}" data-m="${m}"><span>${mi[m]}</span>${TX.md[m][lang]}</button>`).join('')}</div><h3>${TX.th[lang]}</h3>${TR.map((t,i)=>`<button class="trk ${i==ti&&mode!='off'?'sel':''}" data-i="${i}"><span class="d">${i==ti&&musicOn?'♪':i+1}</span><div>${t.n[lang]}</div></button>`).join('')}`}
$('menu').onclick=e=>{const m=e.target.closest('.mode'),t=e.target.closest('.trk');if(m)setMode(m.dataset.m);else if(t)pick(+t.dataset.i)};
$('mus').onclick=e=>{e.stopPropagation();$('menu').classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.mwrap'))$('menu').classList.remove('open')});

/* fullscreen button (hidden where the browser doesn't support it, e.g. iPhone Safari) */
(function(){const d=document.documentElement;if(!d.requestFullscreen)return;
 ['lg','lg2'].forEach(id=>{const l=document.getElementById(id);if(!l)return;const b=document.createElement('button');b.className='pill';b.textContent='⛶';b.setAttribute('aria-label','Fullscreen');
  b.onclick=()=>document.fullscreenElement?document.exitFullscreen():d.requestFullscreen();l.parentNode.insertBefore(b,l)});

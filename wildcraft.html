<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WILDCRAFT — Lost Island</title>
<style>
:root{--pan:rgba(11,24,23,.93);--edge:#3d5f56;--brass:#e0a93f;--sea:#7fd6c2;--ember:#ff7a45;--paper:#f2e8d0;--mute:#9bb2a9;--bad:#ff6262;--good:#7be27b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#06100f;overflow:hidden;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--paper)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#stats{position:absolute;left:12px;top:12px;width:236px;padding:9px 12px 8px;background:rgba(8,20,19,.66);border:1px solid rgba(127,214,194,.28);border-radius:12px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.bar b{width:20px;font-weight:400;text-align:center}
.bar i{flex:1;height:10px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;display:block;position:relative}
.bar u{display:block;height:100%;width:100%;border-radius:6px;text-decoration:none;transition:width .15s}
.bar span{width:62px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.hp u{background:linear-gradient(#ff8a8a,#d13c3c)}.hun u{background:linear-gradient(#ffc070,#d9792b)}.wat u{background:linear-gradient(#8cd0ff,#2f83d6)}.sta u{background:linear-gradient(#f6f48a,#c9b92c)}
.tmp i{background:linear-gradient(90deg,#4aa3ff,#7fe0c8 40%,#ffd27a 65%,#ff5a3a)}
.tmp u{position:absolute;top:-1px;width:4px!important;height:12px;background:#fff;border-radius:2px;box-shadow:0 0 4px #000;transition:left .3s}
#lvl{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px;color:var(--brass)}
#lvl i{flex:1;height:5px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;display:block}
#lvl u{display:block;height:100%;background:var(--brass);width:0}
#sp{font-size:11px;color:var(--sea);margin-top:3px}
#clock{position:absolute;right:12px;top:12px;text-align:right;padding:8px 14px;background:rgba(8,20,19,.66);border:1px solid rgba(127,214,194,.28);border-radius:12px;min-width:132px}
#t_day{font-family:Georgia,serif;font-size:20px;font-weight:bold;letter-spacing:2px;color:var(--brass)}
#t_time{font-size:22px;font-variant-numeric:tabular-nums}
#t_wx,#t_loc{font-size:12px;color:var(--mute)}
#hudbtns{position:absolute;right:12px;top:118px;display:flex;flex-direction:column;gap:6px;pointer-events:auto}
#hudbtns button{width:40px;height:40px;border-radius:10px;border:1px solid rgba(127,214,194,.35);background:rgba(8,20,19,.7);color:var(--paper);font-size:18px}
#boss{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:min(620px,54vw);text-align:center}
#boss_n{font-family:Georgia,serif;letter-spacing:4px;font-size:15px;font-weight:bold;color:#ffd6a0;text-shadow:0 2px 6px #000;margin-bottom:4px}
#boss i{display:block;height:18px;background:rgba(0,0,0,.65);border:2px solid #a2452a;border-radius:10px;overflow:hidden}
#boss u{display:block;height:100%;width:100%;background:linear-gradient(#ff8a4a,#b3260f);transition:width .2s}
#quest{position:absolute;left:12px;top:172px;max-width:250px;padding:7px 10px;background:rgba(8,20,19,.55);border-left:3px solid var(--brass);border-radius:6px;font-size:12px;line-height:1.35}
#quest b{color:var(--brass);display:block;font-size:11px;letter-spacing:1px}
#prompt{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);padding:6px 16px;background:rgba(8,20,19,.8);border:1px solid var(--sea);border-radius:20px;font-size:14px;white-space:nowrap}
#prog{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);width:230px;text-align:center;font-weight:bold;letter-spacing:2px;font-size:13px;text-shadow:0 2px 4px #000}
#prog i{display:block;height:12px;margin-top:4px;background:rgba(0,0,0,.6);border:1px solid var(--brass);border-radius:8px;overflow:hidden}
#prog u{display:block;height:100%;width:0;background:linear-gradient(#ffd27a,#d28a1e)}
#msgs{position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center;width:min(520px,90vw)}
.msg{font-family:Georgia,serif;font-size:20px;font-weight:bold;text-shadow:0 2px 6px #000,0 0 12px rgba(0,0,0,.7);animation:mfade 2.4s forwards;margin:2px 0;letter-spacing:1px}
@keyframes mfade{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#hotwrap{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);text-align:center}
#sel{font-size:13px;margin-bottom:5px;min-height:18px;text-shadow:0 2px 4px #000}
#hotbar{display:flex;gap:5px;pointer-events:auto}
.hs{width:52px;height:52px;background:rgba(8,20,19,.72);border:2px solid rgba(127,214,194,.25);border-radius:9px;position:relative;display:flex;align-items:center;justify-content:center;font-size:26px}
.hs.on{border-color:var(--brass);box-shadow:0 0 10px rgba(224,169,63,.55)}
.hs small{position:absolute;left:4px;top:1px;font-size:10px;color:var(--mute)}
.hs em{position:absolute;right:4px;bottom:1px;font-size:11px;font-style:normal;font-weight:bold;text-shadow:0 1px 2px #000}
#fps{position:absolute;left:12px;bottom:12px;font:11px monospace;background:rgba(0,0,0,.6);padding:5px 8px;border-radius:6px;color:#9f9;white-space:pre}
/* overlays */
.scr{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(3,10,9,.72);backdrop-filter:blur(3px)}
.win{position:relative;width:min(900px,96vw);max-height:92vh;overflow:auto;background:var(--pan);border:2px solid var(--edge);border-radius:14px;padding:16px 18px;box-shadow:0 10px 50px rgba(0,0,0,.7)}
.win h2{font-family:Georgia,serif;margin:0 0 10px;letter-spacing:3px;color:var(--brass)}
.x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:8px;border:1px solid var(--edge);background:#142a27;color:var(--paper);font-size:16px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;padding-right:40px}
.tabs button{padding:7px 14px;border-radius:8px;border:1px solid var(--edge);background:#122624;color:var(--mute);font-size:14px}
.tabs button.on{background:var(--brass);color:#1b1305;border-color:var(--brass);font-weight:bold}
.btn{padding:10px 18px;border-radius:9px;border:1px solid var(--edge);background:#17322e;color:var(--paper);font-size:15px;letter-spacing:1px}
.btn:hover:not(:disabled){background:#1f4740;border-color:var(--sea)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(#f0b64c,#c8871f);color:#1b1305;border-color:#f0b64c;font-weight:bold}
.btn.sm{padding:5px 10px;font-size:13px}
.igrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;background:#0d1f1d;border:2px solid #21403b;border-radius:9px;position:relative;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
.slot.hot{border-color:#5b7a52}.slot.on{outline:2px solid var(--sea)}
.slot em{position:absolute;right:4px;bottom:1px;font-size:12px;font-style:normal;font-weight:bold}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.card{background:#0d1f1d;border:1px solid #21403b;border-radius:10px;padding:10px 12px}
.rec{display:flex;align-items:center;gap:10px;background:#0d1f1d;border:1px solid #21403b;border-radius:10px;padding:8px 10px;margin-bottom:7px}
.rec .ic{font-size:30px;width:40px;text-align:center}.rec .inf{flex:1;font-size:13px}
.chip{display:inline-block;margin:2px 4px 0 0;padding:1px 7px;border-radius:10px;background:#16302c;font-size:12px}
.chip.no{color:var(--bad)}.chip.ok{color:var(--good)}
.skcol{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sk{margin-bottom:8px;padding:8px;border:1px solid #21403b;border-radius:9px;background:#0d1f1d;font-size:12px}
.sk b{font-size:13px}.pips{color:var(--brass);letter-spacing:2px}
.cent{text-align:center}
.title{font-family:Georgia,"Times New Roman",serif;font-size:min(13vw,96px);font-weight:bold;letter-spacing:.12em;line-height:1;color:#f7e7bd;text-shadow:0 4px 0 #6d3f16,0 8px 24px rgba(0,0,0,.7);margin:0}
.sub{font-family:Georgia,serif;letter-spacing:.7em;color:var(--sea);margin:6px 0 26px;font-size:min(4vw,20px);padding-left:.7em}
.mm{display:flex;flex-direction:column;gap:10px;align-items:stretch;width:min(300px,80vw);margin:0 auto}
#menu{background:radial-gradient(ellipse at center,rgba(3,12,12,.35),rgba(2,8,8,.85))}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #21403b}
.ach{display:flex;gap:12px;align-items:center;padding:8px;border:1px solid #21403b;border-radius:10px;margin-bottom:7px;background:#0d1f1d}
.ach.lock{opacity:.45;filter:grayscale(1)}.ach .i{font-size:28px}
#intro{background:transparent;backdrop-filter:none;pointer-events:none}
#intro .l{font-family:Georgia,serif;font-size:min(7vw,44px);letter-spacing:.14em;text-align:center;color:#f4ecd6;text-shadow:0 3px 14px #000;opacity:0;transition:opacity 1.2s}
#intro .l.on{opacity:1}
#skip{position:fixed;right:18px;bottom:18px;pointer-events:auto}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;background:rgba(10,30,26,.94);border:1px solid var(--sea);border-radius:20px;padding:6px 18px;font-size:14px;pointer-events:none;opacity:0;transition:opacity .3s}
#toast.on{opacity:1}
#achpop{position:fixed;right:16px;top:150px;z-index:30;background:#241a08;border:2px solid var(--brass);border-radius:12px;padding:10px 16px;transform:translateX(130%);transition:transform .5s;pointer-events:none}
#achpop.on{transform:none}
#mapwrap{position:relative;display:flex;justify-content:center}
#mapc{width:min(78vh,92vw);height:min(78vh,92vw);border:2px solid var(--edge);border-radius:8px;background:#000}
/* touch */
#touch{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}
body.touch #touch{display:block}
#dpad{position:absolute;left:16px;bottom:16px;width:150px;height:150px;pointer-events:auto}
#dpad button{position:absolute;width:50px;height:50px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(20,40,38,.62);color:#fff;font-size:20px;touch-action:none}
#tb{position:absolute;right:14px;bottom:70px;width:200px;height:190px;pointer-events:auto}
#tb button{position:absolute;width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(20,40,38,.62);color:#fff;font-size:12px;touch-action:none;line-height:1.1}
body.touch #hotwrap{bottom:2px;transform:translateX(-50%) scale(.72);transform-origin:bottom center}
body.touch #prompt{bottom:110px}
body.touch #stats{transform:scale(.85);transform-origin:top left}
body.touch #quest{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="stats">
    <div class="bar hp"><b>❤️</b><i><u id="b_hp"></u></i><span id="t_hp"></span></div>
    <div class="bar hun"><b>🍗</b><i><u id="b_hun"></u></i><span id="t_hun"></span></div>
    <div class="bar wat"><b>💧</b><i><u id="b_wat"></u></i><span id="t_wat"></span></div>
    <div class="bar sta"><b>⚡</b><i><u id="b_sta"></u></i><span id="t_sta"></span></div>
    <div class="bar tmp"><b>🌡️</b><i><u id="b_tmp"></u></i><span id="t_tmp"></span></div>
    <div id="lvl">LV <span id="t_lv">1</span><i><u id="b_xp"></u></i><span id="t_xp"></span></div>
    <div id="sp" class="hidden"></div>
  </div>
  <div id="clock"><div id="t_day">DAY 1</div><div id="t_time">07:00</div><div id="t_wx">☀️ Sunny</div><div id="t_loc"></div></div>
  <div id="hudbtns">
    <button data-open="inv" title="Inventory (I)">🎒</button>
    <button data-open="craft" title="Crafting (C)">🔨</button>
    <button data-open="build" title="Build (B)">🏠</button>
    <button data-open="map" title="Map (M)">🗺️</button>
    <button data-open="pause" title="Pause (Esc)">⏸️</button>
  </div>
  <div id="boss" class="hidden"><div id="boss_n">THE ISLAND GUARDIAN</div><i><u id="boss_b"></u></i></div>
  <div id="quest"></div>
  <div id="prompt" class="hidden"></div>
  <div id="prog" class="hidden"><span id="prog_t"></span><i><u id="prog_b"></u></i></div>
  <div id="msgs"></div>
  <div id="hotwrap"><div id="sel"></div><div id="hotbar"></div></div>
  <div id="fps" class="hidden"></div>
</div>

<div id="touch">
  <div id="dpad">
    <button data-k="KeyW" style="left:50px;top:0">⬆</button>
    <button data-k="KeyA" style="left:0;top:50px">⬅</button>
    <button data-k="KeyD" style="left:100px;top:50px">➡</button>
    <button data-k="KeyS" style="left:50px;top:100px">⬇</button>
  </div>
  <div id="tb">
    <button data-k="KeyF" style="right:0;top:56px;width:74px;height:74px;font-size:13px">⚔️<br>ATTACK</button>
    <button data-k="Space" style="right:82px;top:0">🦘<br>JUMP</button>
    <button data-k="ShiftLeft" style="right:84px;top:100px">🏃<br>SPRINT</button>
    <button data-k="KeyE" style="right:0;top:0;width:56px;height:56px">✋<br>USE</button>
    <button data-k="KeyI" style="right:150px;top:56px;width:50px;height:50px">🎒</button>
    <button data-k="KeyP" id="tplace" class="hidden" style="right:150px;top:0;width:50px;height:50px">📌</button>
  </div>
</div>

<div id="toast"></div>
<div id="achpop"></div>

<div id="menu" class="scr hidden"><div class="cent">
  <h1 class="title">WILDCRAFT</h1><div class="sub">LOST ISLAND</div>
  <div class="mm">
    <button class="btn pri" id="m_new">▶ NEW GAME</button>
    <button class="btn" id="m_cont">▶ CONTINUE</button>
    <button class="btn" id="m_set">⚙ SETTINGS</button>
    <button class="btn" id="m_ach">🏆 ACHIEVEMENTS</button>
    <button class="btn" id="m_exit">❌ EXIT</button>
  </div>
  <p style="color:var(--mute);font-size:12px;margin-top:18px">WASD move · SHIFT sprint · SPACE jump · E interact · F attack · I / C / B / K panels · M map</p>
</div></div>

<div id="pause" class="scr hidden"><div class="win" style="width:min(340px,92vw)"><h2 class="cent">PAUSED</h2>
  <div class="mm">
    <button class="btn pri" id="p_res">RESUME</button>
    <button class="btn" id="p_inv">INVENTORY</button>
    <button class="btn" id="p_craft">CRAFTING</button>
    <button class="btn" id="p_set">SETTINGS</button>
    <button class="btn" id="p_save">SAVE GAME</button>
    <button class="btn" id="p_menu">MAIN MENU</button>
  </div>
</div></div>

<div id="settings" class="scr hidden"><div class="win" style="width:min(460px,94vw)"><h2>SETTINGS</h2>
  <div id="setbody"></div>
  <div class="cent" style="margin-top:14px"><button class="btn" id="s_back">BACK</button></div>
</div></div>

<div id="ach" class="scr hidden"><div class="win" style="width:min(560px,94vw)"><h2>ACHIEVEMENTS</h2>
  <div id="achbody"></div>
  <div class="cent" style="margin-top:10px"><button class="btn" id="a_back">BACK</button></div>
</div></div>

<div id="panel" class="scr hidden"><div class="win">
  <button class="x" id="pclose">✕</button>
  <div class="tabs" id="tabs"></div>
  <div id="pbody"></div>
</div></div>

<div id="mapp" class="scr hidden"><div class="win" style="width:min(92vh,96vw)">
  <button class="x" id="mclose">✕</button><h2>ISLAND MAP</h2>
  <div id="mapwrap"><canvas id="mapc" width="640" height="640" style="position:static"></canvas></div>
  <div id="maplegend" style="font-size:12px;color:var(--mute);margin-top:8px"></div>
</div></div>

<div id="intro" class="scr hidden"><div id="introtxt" class="l"></div>
  <button class="btn" id="skip">SKIP ▶</button></div>

<div id="over" class="scr hidden"><div class="win cent" style="width:min(420px,94vw)">
  <h1 class="title" style="font-size:52px;color:#ff8a7a">YOU DIED</h1>
  <p id="overtxt" style="color:var(--mute)"></p>
  <div class="mm">
    <button class="btn pri" id="o_load">LOAD LAST SAVE</button>
    <button class="btn" id="o_new">RESTART</button>
    <button class="btn" id="o_menu">MAIN MENU</button>
  </div>
</div></div>

<div id="win" class="scr hidden"><div class="win cent" style="width:min(480px,94vw)">
  <h1 class="title" style="font-size:44px">🏆 ISLAND CONQUERED</h1>
  <p id="wintxt" style="color:var(--mute)"></p>
  <div class="mm">
    <button class="btn pri" id="w_cont">KEEP EXPLORING</button>
    <button class="btn" id="w_menu">MAIN MENU</button>
  </div>
</div></div>

<div id="bye" class="scr hidden" style="background:#04100f"><div class="cent"><h1 class="title" style="font-size:40px">FAREWELL, SURVIVOR</h1><p style="color:var(--mute)">You can close this tab now.</p><button class="btn" id="b_back">BACK TO MENU</button></div></div>

<script>
'use strict';
/* ============================ UTILITIES ============================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a), rint=(a,b)=>Math.floor(rnd(a,b+.9999)), pick=a=>a[Math.floor(Math.random()*a.length)];
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,2147483647))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi,s),hash2(xi+1,yi,s),u),lerp(hash2(xi,yi+1,s),hash2(xi+1,yi+1,s),u),v)}
function fbm(x,y,s,o){o=o||4;let v=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){v+=a*vnoise(x*f,y*f,s+i*101);n+=a;a*=.5;f*=2}return v/n}
const TAU=Math.PI*2;

/* ============================ DATA ============================ */
const RN=['Common','Uncommon','Rare','Epic','Legendary'], RCOL=['#cfd6d2','#68d67a','#58a9ff','#c07cff','#ffb640'];
const IT={};
function defItem(id,n,i,r,d,o){IT[id]=Object.assign({id:id,n:n,i:i,r:r,d:d,st:99},o||{})}
defItem('wood','Wood','🪵',0,'Sturdy branches and planks. The backbone of everything.');
defItem('log','Log','🌳',1,'A heavy hardwood log. Used for roofs, chests and towers.');
defItem('stone','Stone','🪨',0,'Rough stone for tools and walls.');
defItem('iron','Iron Ore','⛓️',2,'Dark ore. Makes strong weapons and armor.');
defItem('crystal','Crystal','💎',3,'A humming crystal from deep rock.');
defItem('herb','Herb','🌿',0,'Bitter leaves. Good for bandages and rope. Edible in a pinch.',{food:3,hp:2});
defItem('apple','Apple','🍎',0,'Sweet and juicy.',{food:14,water:5});
defItem('berries','Berries','🫐',0,'Small tart berries.',{food:9,water:7});
defItem('meat','Raw Meat','🥩',0,'Cook it over a fire. Eating it raw makes you sick.',{food:12,hp:-8});
defItem('cooked','Cooked Meat','🍖',1,'Hearty and hot.',{food:40,hp:8});
defItem('coal','Coal','⚫',1,'Burns hot. Needed for torches.');
defItem('gold','Gold','🟡',2,'Soft, bright metal.');
defItem('rope','Rope','➰',1,'Twisted plant fibre.');
defItem('leather','Leather','🟫',1,'Tough animal hide.');

const AU={ctx:null,master:null,mg:null,nb:null,on:true,music:true,vol:.7,mt:0,mstep:0};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=AU.vol*.55;AU.master.connect(AU.ctx.destination);
    AU.mg=AU.ctx.createGain();AU.mg.gain.value=.5;AU.mg.connect(AU.master);
    const len=AU.ctx.sampleRate;AU.nb=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);const d=AU.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  }catch(e){AU.ctx=null}
}
function setVol(v){AU.vol=v;if(AU.master)AU.master.gain.value=v*.55}
function tone(f,d,type,v,slide,delay,dest){
  if(!AU.ctx||!AU.on&&!dest)return;const c=AU.ctx,t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||AU.master);o.start(t);o.stop(t+d+.05);
}
function noise(d,v,fq,type,delay,sweep){
  if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=c.currentTime+(delay||0);
  const s=c.createBufferSource();s.buffer=AU.nb;s.loop=true;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(fq||800,t);
  if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(40,fq+sweep),t+d);
  const g=c.createGain();g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(AU.master);s.start(t,Math.random()*.5);s.stop(t+d+.05);
}

function genWorld(seed){

  }

    if(x<1||y<1||x>=WW-1||y>=WH-1)continue;

  const zones=[{x:sp.x,y:sp.y,r:3.5},{x:vol.x,y:vol.y,r:20}];

/* ============================ DUNGEON GENERATION ============================ */
const DW=56,DH=40;
const DT={
 cave:{n:'Deep Cave',fl:[78,68,60],wl:[38,33,32],tp:[104,92,82],mobs:['spider','spider','golem','shadowwolf'],warden:'golem',dk:.86,ic:'🕳️'},

function tryDungeon(type,seed,relaxed){
  const rng=mulberry32(seed),tiles=new Uint8Array(DW*DH),rooms=[],cor=new Set();
  for(let n=0;n<300&&rooms.length<9;n++){
    const w=6+Math.floor(rng()*5),h=5+Math.floor(rng()*4),x=3+Math.floor(rng()*(DW-w-6)),y=3+Math.floor(rng()*(DH-h-6));
    let bad=false;for(const r of rooms){if(x<r.x+r.w+3&&x+w+3>r.x&&y<r.y+r.h+3&&y+h+3>r.y){bad=true;break}}
    if(!bad)rooms.push({x:x,y:y,w:w,h:h,cx:x+Math.floor(w/2),cy:y+Math.floor(h/2)});
  }
  if(rooms.length<6)return null;

  const setC=(x,y)=>{if(x>0&&y>0&&x<DW-1&&y<DH-1&&!tiles[y*DW+x]){tiles[y*DW+x]=1;cor.add(y*DW+x)}};
  for(let i=0;i<rooms.length-1;i++){
    const a=rooms[i],b=rooms[i+1],x1=a.cx,y1=a.cy,x2=b.cx,y2=b.cy;
    for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++){setC(x,y1);setC(x,y1+1)}
    for(let y=Math.min(y1,y2);y<=Math.max(y1,y2)+1;y++){setC(x2,y);setC(x2+1,y)}
  }
  const vault=rooms[rooms.length-1],doors=[];
  for(let y=vault.y-1;y<=vault.y+vault.h;y++)for(let x=vault.x-1;x<=vault.x+vault.w;x++){
    const inside=x>=vault.x&&x<vault.x+vault.w&&y>=vault.y&&y<vault.y+vault.h;
    if(!inside&&tiles[y*DW+x]===1)doors.push({x:x,y:y});
  }
  if(doors.length<1||(doors.length>2&&!relaxed))return null;
  const D={isDun:true,type:type,tiles:tiles,rooms:rooms,statics:[],mobs:[],drops:[],proj:[],warn:[],w:DW,h:DH,vault:vault,doors:doors,def:DT[type],lights:[],key:null,t:0,cleared:false,seed:seed};
  const st=(s)=>{s.k=s.k||'dec';D.statics.push(s);return s};
  const c16=t=>t*TS+16;
  for(const d of doors)st({k:'lockdoor',t:'lock',x:c16(d.x),y:c16(d.y),box:1,dtype:type,id:'d'+type+'_v'});
  const r0=rooms[0];D.start={x:c16(r0.cx),y:c16(r0.cy)};
  st({k:'exit',t:'exit',x:c16(r0.x+1),y:c16(r0.cy),r:0});
  // key warden room
  const kr=Math.max(1,Math.min(rooms.length-2,Math.floor(rooms.length/2)));
  let cid=0;
  for(let i=1;i<rooms.length;i++){
    const r=rooms[i];
    if(i===rooms.length-1){
      st({k:'lchest',t:'loot',x:c16(r.x+1),y:c16(r.cy),r:12,tier:3,open:false,id:'d'+type+'_c'+(cid++)});
      st({k:'lchest',t:'loot',x:c16(r.x+r.w-2),y:c16(r.cy),r:12,tier:3,open:false,id:'d'+type+'_c'+(cid++)});
      st({k:'dec',t:'statue',x:c16(r.cx),y:c16(r.y+1),r:14});continue;
    }
    if(i===kr){D.mobs.push({spawn:'warden',x:c16(r.cx),y:c16(r.cy)});
      st({k:'lchest',t:'loot',x:c16(r.x+r.w-2),y:c16(r.y+1),r:12,tier:2,open:false,id:'d'+type+'_c'+(cid++)});continue}
    const n=2+Math.floor(rng()*3);
    for(let m=0;m<n;m++)D.mobs.push({spawn:DT[type].mobs[Math.floor(rng()*4)],x:c16(r.x+1+Math.floor(rng()*(r.w-2))),y:c16(r.y+1+Math.floor(rng()*(r.h-2)))});
    if(rng()<.55)st({k:'lchest',t:'loot',x:c16(r.x+1+Math.floor(rng()*(r.w-2))),y:c16(r.y+r.h-1),r:12,tier:2,open:false,id:'d'+type+'_c'+(cid++)});
  }
  // secret room
  let made=false;
  const free=(x0,y0,x1,y1)=>{if(x0<2||y0<2||x1>DW-3||y1>DH-3)return false;for(let y=y0-1;y<=y1+1;y++)for(let x=x0-1;x<=x1+1;x++)if(tiles[y*DW+x])return false;return true};
  for(let pass=0;pass<2&&!made;pass++)for(let i=0;i<rooms.length-1&&!made;i++){
    const r=rooms[i],sides=[0,1,2,3];
    for(const sd of sides){
      let gx,gy,x0,y0,x1,y1;
      if(sd===0){gx=r.cx;gy=r.y-1;x0=gx-2;x1=gx+2;y0=gy-4;y1=gy-1}
      else if(sd===1){gx=r.cx;gy=r.y+r.h;x0=gx-2;x1=gx+2;y0=gy+1;y1=gy+4}
      else if(sd===2){gx=r.x-1;gy=r.cy;x0=gx-5;x1=gx-1;y0=gy-1;y1=gy+2}
      else{gx=r.x+r.w;gy=r.cy;x0=gx+1;x1=gx+5;y0=gy-1;y1=gy+2}
      if(!free(x0,y0,x1,y1))continue;
      for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)tiles[y*DW+x]=1;tiles[gy*DW+gx]=1;
      st({k:'secret',t:'secret',x:c16(gx),y:c16(gy),box:1,id:'d'+type+'_s'});
      st({k:'lchest',t:'loot',x:c16((x0+x1)>>1),y:c16((y0+y1)>>1),r:12,tier:3,open:false,id:'d'+type+'_c'+(cid++)});
      made=true;break;
    }
  }
  // traps
  const cl=[...cor];
  for(let i=0;i<16&&cl.length;i++){
    const idx=cl[Math.floor(rng()*cl.length)],x=idx%DW,y=Math.floor(idx/DW);
    if(Math.hypot(x-r0.cx,y-r0.cy)<6)continue;st({k:'trap',t:'spikes',x:c16(x),y:c16(y),r:0,ph:rng()*3});
  }
  for(let i=1;i<rooms.length-1;i++){const r=rooms[i];if(rng()<.8)st({k:'trap',t:'spikes',x:c16(r.x+1+Math.floor(rng()*(r.w-2))),y:c16(r.y+1+Math.floor(rng()*(r.h-2))),r:0,ph:rng()*3})}
  // lights (wall torches)
  for(const r of rooms){D.lights.push({x:c16(r.x),y:c16(r.y-1)+4,r:150});D.lights.push({x:c16(r.x+r.w-1),y:c16(r.y-1)+4,r:150})}
  return D;
}
function genDungeon(type){
  let base=W.seed+type.charCodeAt(0)*131+type.length*17;
  for(let a=0;a<60;a++){const d=tryDungeon(type,base+a*977);if(d)return d}
  for(let a=0;a<60;a++){const d=tryDungeon(type,base+a*977,true);if(d)return d}
  return null;
}

/* ============================ COLLISION ============================ */
function solidTile(tx,ty){
  if(A.isDun)return tx<0||ty<0||tx>=DW||ty>=DH||A.tiles[ty*DW+tx]===0;
  return SOLIDT[tileAt(tx,ty)]===1;
}
function blockedAt(x,y,r,noSt){
  const x0=Math.floor((x-r)/TS),x1=Math.floor((x+r)/TS),y0=Math.floor((y-r)/TS),y1=Math.floor((y+r)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(solidTile(tx,ty)){const cx=clamp(x,tx*TS,tx*TS+TS),cy=clamp(y,ty*TS,ty*TS+TS);if((x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r)return true}
  }
  if(noSt)return false;
  const ns=nearStatics(x,y,r+34);
  for(let i=0;i<ns.length;i++){
    const s=ns[i];if(s.dead)continue;
    if(s.box){
      if(s.open)continue;
      const cx=clamp(x,s.x-16,s.x+16),cy=clamp(y,s.y-16,s.y+16);if((x-cx)*(x-cx)+(y-cy)*(y-cy)<r*r)return true;
    }else if(s.r>0&&s.k!=='ent'){const dx=x-s.x,dy=y-s.y,rr=r+s.r;if(dx*dx+dy*dy<rr*rr)return true}
  }
  return false;
}
function moveEnt(e,dx,dy){
  const nx=e.x+dx;if(!blockedAt(nx,e.y,e.r))e.x=nx;
  const ny=e.y+dy;if(!blockedAt(e.x,ny,e.r))e.y=ny;
}

function updateFx(dt){
  for(let i=0;i<parts.length;i++){const p=parts[i];if(!p.on)continue;
    p.life-=dt;if(p.life<=0){p.on=false;continue}

  place('snake',[T.DESERT,T.JUNGLE],14,20);place('croc',[T.SHAL],8,25);
  for(const c of W.camps){mkMob('orc',c.x+rnd(-70,70),c.y+rnd(50,90),{guard:true});if(c.tier)mkMob('orc',c.x-60,c.y+60,{guard:true})}

function updateMob(m,dt){
  const d=m.def,dx=P.x-m.x,dy=P.y-m.y,dp=Math.hypot(dx,dy)||1;
  m.fl=Math.max(0,m.fl-dt);m.atkCD-=dt;m.ph+=dt*(m.moving?9:2);
  if(m.burn>0){m.burn-=dt;if(Math.random()<.5)spawnP(m.x+rnd(-8,8),m.y,rnd(-10,10),rnd(-20,0),.5,3,'#ff9a3c',{z:rnd(4,22),vz:40,g:-40,glow:1});if(m.burn<=0){m.dead=true;m.noDrop=true}return}
  if(m.kx||m.ky){moveEnt(m,m.kx*dt,m.ky*dt);const f=Math.pow(.015,dt);m.kx*=f;m.ky*=f;if(Math.abs(m.kx)+Math.abs(m.ky)<8)m.kx=m.ky=0}
  if(d.beh==='boss'){updateBoss(m,dt);return}
  const night=G.dark>.45;let spd=d.spd,mx=0,my=0;m.moving=false;
  if(m.st==='wind'){
    m.wind-=dt;
    if(m.wind<=0){
      m.st='recover';m.tm=.45;
      if(d.shoot){const a=Math.atan2(dy,dx);addProj(m.x,m.y-8,Math.cos(a)*200,Math.sin(a)*200,m.dmg,'enemy','fire',2.2)}
      else{
        if(m.t==='golem'){shake(5);burst(m.x,m.y+10,12,'#8a8a86',140,.5,3);sfx('boom')}
        if(dp<d.rng+m.r+8)hurtPlayer(m.dmg,m.x,m.y,d.poison);
      }
      m.atkCD=(m.t==='golem'?1.8:1.05)+rnd(0,.5);
    }
    return;
  }
  if(m.st==='recover'){m.tm-=dt;if(m.tm<=0)m.st='idle';return}
  let chase=false,flee=false;
  const fog=G.wx.fog>.5?.75:1,aggR=(d.aggro||0)*fog*(m.elite?1.2:1);
  if(d.beh==='passive'){if(dp<170)flee=true}
  else if(d.beh==='neutral'){if(m.aggro||dp<aggR)chase=true;if(dp>360)m.aggro=false}
  else if(d.beh==='hostile'){if(dp<aggR||m.aggro){chase=true;m.aggro=true}if(dp>aggR*2.3&&!m.warden)m.aggro=false;
    if(m.guard&&Math.hypot(m.x-m.home.x,m.y-m.home.y)>260)chase=false;if(P.dead)chase=false;if(m.aggro&&dp<aggR*2.3)chase=true}
  else if(d.beh==='ambush'){if(dp<aggR||(m.aggro&&dp<aggR*2.2))chase=true;else m.aggro=false}
  if(P.dead)chase=false;
  if(m.warden&&!m.aggro&&dp<420){m.aggro=true}
  if(m.warden&&m.aggro&&dp<600&&!P.dead)chase=true;
  if(flee){const a=Math.atan2(-dy,-dx);mx=Math.cos(a);my=Math.sin(a);spd*=1.55;m.moving=true}
  else if(chase){
    if(dp>d.rng+m.r-4){mx=dx/dp;my=dy/dp;m.moving=true;spd*=(d.beh==='ambush'?1.35:1)}
    else if(m.atkCD<=0){m.st='wind';m.wind=d.wind||.35;m.dirx=dx>0?1:-1;if(d.wind&&d.wind>.4)sfx('warn');return}
    if(d.shoot&&dp<260&&dp>120){mx=0;my=0;m.moving=false;if(m.atkCD<=0){m.st='wind';m.wind=d.wind}}
    else if(d.shoot&&dp<120){mx=-dx/dp;my=-dy/dp;m.moving=true}
  }else{
    m.tm-=dt;
    if(m.tm<=0){
      if(Math.random()<.5||(night&&!m.mon&&d.beh!=='hostile')){m.st='idle';m.tm=rnd(1.5,4)}
      else{m.st='wander';m.tm=rnd(1.2,3);m.ang=Math.random()*TAU;
        const hd=Math.hypot(m.x-m.home.x,m.y-m.home.y),lim=d.beh==='ambush'?130:m.mon?600:320;
        if(hd>lim)m.ang=Math.atan2(m.home.y-m.y,m.home.x-m.x)}
    }
    if(m.st==='wander'){mx=Math.cos(m.ang);my=Math.sin(m.ang);spd*=night&&!m.mon?.35:.42;m.moving=true}
  }
  if(m.det>0){m.det-=dt;const ca=Math.cos(m.detA),sa=Math.sin(m.detA),nx=mx*ca-my*sa,ny=mx*sa+my*ca;mx=nx;my=ny}
  if(m.moving){
    const ox=m.x,oy=m.y;
    // water-lovers slow in dry land / wading slows land creatures
    const tt=tileTypeAt(m.x,m.y);if(tt===T.SHAL)spd*=(m.t==='croc'?1.2:.7);else if(m.t==='croc'&&(tt!==T.SAND))spd*=.8;
    moveEnt(m,mx*spd*dt,my*spd*dt);
    if(Math.abs(m.x-ox)+Math.abs(m.y-oy)<spd*dt*.2){m.stuck+=dt;if(m.stuck>.3){m.det=.7;m.detA=(Math.random()<.5?1:-1)*(1.1+Math.random()*.6);m.stuck=0;if(m.st==='wander')m.ang+=Math.PI*rnd(.5,1.5)}}else m.stuck=0;
    if(Math.abs(mx)>.2)m.dirx=mx>0?1:-1;
  }
  if(m.dirx)m.fx=m.dirx;
  // elite glow particles
  if(m.elite&&Math.random()<.12)spawnP(m.x+rnd(-10,10),m.y,0,0,.6,2.5,m.mon?'#c07cff':'#ffdd66',{z:rnd(4,26),vz:24,g:-10,glow:1});
  if(m.t==='fire'&&Math.random()<.3)spawnP(m.x+rnd(-6,6),m.y,rnd(-8,8),0,.5,3,'#ff9a3c',{z:rnd(6,22),vz:40,g:-40,glow:1});
}
function hurtMob(m,dmg,o){
  if(m.dead||m.burn>0)return;o=o||{};
  if(m.def.beh==='boss'&&(!m.active||m.dead))return;
  m.hp-=dmg;m.fl=.15;m.aggro=true;
  ftext(m.x,m.y-m.r-16,String(Math.round(dmg))+(o.crit?'!':''),o.crit?'#ffd45a':'#fff',o.crit?20:15);
  if(m.def.beh!=='boss'&&o.kx!==undefined){const k=m.def.beh==='boss'?0:(m.t==='golem'?120:230);m.kx+=o.kx*k;m.ky+=o.ky*k;if(m.st==='wind'&&Math.random()<.5){m.st='idle'}}
  burst(m.x,m.y,o.crit?12:6,m.t==='fire'?'#ff9a3c':m.t==='golem'?'#9a9a94':m.mon?'#7a4bd0':'#b8322f',110,.5,2.6,{glow:m.mon?1:0});
  sfx('hit');
  if(m.hp<=0&&m.def.beh!=='boss')killMob(m);
  else if(m.hp<=0&&m.def.beh==='boss')killBoss(m);
}
function luck(){return (P.skills.lucky||0)*.18}
function killMob(m){
  if(m.dead)return;m.dead=true;
  burst(m.x,m.y,14,m.mon?'#9a6cff':'#c33',140,.8,3,{glow:m.mon?1:0});
  if(!m.noDrop){
    const mult=m.elite?1.6:1;
    for(const dr of m.def.drops){if(Math.random()<dr[3]*mult*(1+luck())){dropItem(dr[0],rint(dr[1],dr[2]),m.x,m.y)}}
    if(m.elite){dropItem(pick(['crystal','gold','relic','iron']),1,m.x,m.y)}
    if(m.key){dropItem('key',1,m.x,m.y);popup('THE WARDEN DROPPED A KEY','#ffb640')}
    if(m.warden){ST.wardens++;unlock('bossslayer');dropItem('relic',1,m.x,m.y);dropItem('potion',1,m.x,m.y)}
    xpGain(m.def.xp*(m.elite?2:1)*(m.warden?4:1),m.x,m.y);
    ST.kills++;if(ST.kills>=25)unlock('slayer');
  }
}
function updateMobs(dt){
  const list=A.mobs;
  for(let i=list.length-1;i>=0;i--){
    const m=list[i];
    if(m.dead&&m.def.beh!=='boss'){list.splice(i,1);continue}
    const d=Math.hypot(m.x-P.x,m.y-P.y);
    if(m.def.beh==='boss'){updateMob(m,dt);continue}
    if(d>950&&!A.isDun){
      if(m.mon&&!m.guard&&d>1300)list.splice(i,1);
      continue;
    }
    updateMob(m,dt);
  }
}

/* ============================ PROJECTILES / WARNINGS ============================ */
function addProj(x,y,vx,vy,dmg,from,kind,life,r){A.proj.push({x:x,y:y,vx:vx,vy:vy,dmg:dmg,from:from,kind:kind,life:life||1.4,r:r||5,z:12})}
function updateProj(dt){
  const L=A.proj;
  for(let i=L.length-1;i>=0;i--){
    const p=L[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    let dead=p.life<=0;
    if(!dead&&solidTile(Math.floor(p.x/TS),Math.floor(p.y/TS)))dead=true;
    if(!dead&&p.kind!=='shard'&&blockedAt(p.x,p.y,2))dead=true;
    if(p.from==='enemy'&&!dead&&!P.dead){if(Math.hypot(p.x-P.x,p.y-P.y)<P.r+p.r+3&&P.z<18){hurtPlayer(p.dmg,p.x-p.vx,p.y-p.vy);dead=true;burst(p.x,p.y,8,'#ff9a3c',120,.4,3,{glow:1})}}
    else if(!dead&&p.from!=='enemy'){for(const m of A.mobs){if(m.dead||m.burn>0||(m.def.beh==='boss'&&!m.active))continue;if(Math.hypot(m.x-p.x,m.y-p.y)<m.r+4){
        let dmg=p.dmg,crit=Math.random()<critChance();if(crit)dmg*=2;const a=Math.atan2(p.vy,p.vx);hurtMob(m,dmg,{kx:Math.cos(a),ky:Math.sin(a),crit:crit});dead=true;break}}}
    if(p.kind==='fire'||p.kind==='shard'){if(Math.random()<.6)spawnP(p.x,p.y,rnd(-15,15),rnd(-15,15),.35,3,p.kind==='shard'?'#c9a0ff':'#ff8a3a',{z:p.z,glow:1})}
    if(dead){L.splice(i,1)}
  }
}
function addWarn(o){A.warn.push(Object.assign({t:0,dur:1,hit:false,col:'255,60,40'},o))}
function updateWarn(dt){
  const L=A.warn;
  for(let i=L.length-1;i>=0;i--){
    const w=L[i];w.t+=dt;
    if(w.kind==='circle'){
      if(w.t>=w.dur){
        sfx('boom');shake(w.shake||7);burst(w.x,w.y,22,w.fire?'#ff8a3a':'#a89f92',220,.7,4,{glow:w.fire?1:0});
        if(!P.dead&&w.dmg>0&&Math.hypot(P.x-w.x,P.y-w.y)<w.r+P.r&&P.z<10)hurtPlayer(w.dmg,w.x,w.y);
        for(const m of A.mobs){if(m.def.beh==='boss'||m.dead||!w.hurtMobs)continue;if(Math.hypot(m.x-w.x,m.y-w.y)<w.r)hurtMob(m,w.dmg,{})}
        L.splice(i,1);
      }
    }else if(w.kind==='ring'){
      w.r+=w.speed*dt;
      if(!w.hit&&!P.dead&&Math.abs(Math.hypot(P.x-w.x,P.y-w.y)-w.r)<13+P.r&&P.z<15){w.hit=true;hurtPlayer(w.dmg,w.x,w.y)}
      if(Math.random()<.5)spawnP(w.x+Math.cos(w.a=(w.a||0)+2.4)*w.r,w.y+Math.sin(w.a)*w.r,0,0,.4,3,'#ffb27a',{z:2,vz:30,glow:1});
      if(w.r>=w.maxr)L.splice(i,1);
    }else if(w.kind==='bolt'){
      if(w.t>=w.dur){
        G.wx.flash=1;sfx('thunder');shake(9);burst(w.x,w.y,20,'#dfe9ff',200,.5,3,{glow:1});
        if(!P.dead&&Math.hypot(P.x-w.x,P.y-w.y)<w.r+P.r)hurtPlayer(w.dmg,w.x,w.y);
        L.splice(i,1);
      }
    }
  }
}

/* ============================ THE ISLAND GUARDIAN ============================ */
function bossMsg(t){G.boss.warnTxt=t;G.boss.warnT=1.6}
function updateBoss(b,dt){
  b.warnT=Math.max(0,(b.warnT||0)-dt);b.arm=Math.max(0,b.arm-dt);
  if(b.dead){
    b.deadT+=dt;
    if(b.deadT<3.4&&Math.random()<dt*9){const a=Math.random()*TAU,r=Math.random()*b.r;burst(b.x+Math.cos(a)*r,b.y+Math.sin(a)*r,14,'#ffa040',260,.8,5,{glow:1,vz:140});shake(5);sfx('boom')}
    if(b.deadT>=3.4&&!b.done){b.done=true;finishBoss()}
    return;
  }
  const dx=P.x-b.x,dy=P.y-b.y,dp=Math.hypot(dx,dy)||1;
  if(!b.active){
    if(dp<420&&!P.dead&&A===AW){b.active=true;sfx('roar');shake(14);popup('THE ISLAND GUARDIAN AWAKENS','#ff8a4a');burst(b.x,b.y,30,'#ff9a3c',300,1,5,{glow:1})}
    return;
  }
  if(P.dead)return;
  const ph=b.hp>b.mhp*.75?1:b.hp>b.mhp*.5?2:b.hp>b.mhp*.25?3:4;
  if(ph!==b.phase){b.phase=ph;sfx('roar');shake(16);burst(b.x,b.y,40,ph===4?'#ff4a2a':'#c9a0ff',340,1,5,{glow:1});popup(ph===4?'PHASE 4 — ENRAGED':'PHASE '+ph,'#ff8a4a');b.st='move';b.stagger=1.2;b.cdM=1.5;b.cdS=2;b.cdW=3;b.cdE=4;
    if(ph===3)bossMsg('SHOCKWAVES — JUMP!');if(ph===2)bossMsg('CRYSTAL SHARDS');if(ph===4)bossMsg('ENRAGED!')}
  if(b.stagger>0){b.stagger-=dt;return}
  const en=b.phase===4?1.55:1;
  b.cdM-=dt;b.cdS-=dt;b.cdW-=dt;b.cdE-=dt;b.cdU-=dt;
  if(b.st==='move'){
    if(dp>100){moveEnt(b,dx/dp*b.def.spd*en*dt,dy/dp*b.def.spd*en*dt);b.fx=dx>0?1:-1}
    if(dp<135&&b.cdM<=0){b.st='slam';b.sl=.95/en;const a=Math.atan2(dy,dx);b.sx=b.x+Math.cos(a)*78;b.sy=b.y+Math.sin(a)*78;
      addWarn({kind:'circle',x:b.sx,y:b.sy,r:104,dur:b.sl,dmg:b.def.dmg,shake:10,fire:0});b.arm=b.sl;sfx('warn')}
    else if(b.phase>=3&&b.cdW<=0){b.st='wave';b.sl=1.05/en;addWarn({kind:'circle',x:b.x,y:b.y,r:b.r+16,dur:b.sl,dmg:0,shake:0,col:'255,150,40',noHit:1});bossMsg('SHOCKWAVE — JUMP!');sfx('warn');sfx('roar')}
    else if(b.phase>=2&&b.cdS<=0&&dp>120){b.st='volley';b.sl=.75/en;bossMsg('CRYSTAL SHARDS');sfx('warn')}
    else if(b.phase===4&&b.cdE<=0){b.cdE=4.2;for(let i=0;i<4;i++){const a=Math.random()*TAU,r=i===0?0:rnd(60,190);addWarn({kind:'circle',x:P.x+Math.cos(a)*r,y:P.y+Math.sin(a)*r,r:62,dur:1.15+i*.12,dmg:26,shake:5,fire:1,hurtMobs:0})}sfx('warn')}
    if(b.phase===4&&b.cdU<=0){b.cdU=13;let n=0;for(const m of A.mobs)if(!m.dead&&m.t==='fire')n++;
      if(n<3){for(let i=0;i<2;i++){const a=Math.random()*TAU;const mm=mkMob('fire',b.x+Math.cos(a)*140,b.y+Math.sin(a)*140,{});mm.aggro=true;burst(mm.x,mm.y,14,'#ff8a3a',160,.6,4,{glow:1})}}}
  }else if(b.st==='slam'){
    b.sl-=dt;if(b.sl<=0){b.st='move';b.cdM=b.phase===4?1.5:2.6}
  }else if(b.st==='volley'){
    b.sl-=dt;if(b.sl<=0){
      const n=b.phase===4?9:5,a0=Math.atan2(dy,dx);sfx('shoot');
      for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*(b.phase===4?.2:.24);addProj(b.x,b.y-30,Math.cos(a)*250,Math.sin(a)*250,b.def.dmg*.5,'enemy','shard',2.4,6)}
      b.st='move';b.cdS=b.phase===4?1.9:3.3;b.arm=.4}
  }else if(b.st==='wave'){
    b.sl-=dt;if(b.sl<=0){
      A.warn.push({kind:'ring',x:b.x,y:b.y,r:b.r,speed:240*en,maxr:440,hit:false,dmg:b.def.dmg*.85,t:0});
      shake(12);sfx('boom');burst(b.x,b.y,26,'#ffb27a',300,.6,4,{glow:1});
      b.st='move';b.cdW=b.phase===4?3.4:5;b.arm=.5}
  }
  if(dp<b.r+P.r+8&&!P.dead&&P.iT<=0){hurtPlayer(b.def.dmg*.4,b.x,b.y)}
}
function killBoss(b){

/* ============================ INVENTORY ============================ */
function fixInv(){while(P.inv.length<P.cap)P.inv.push(null);P.inv.length=Math.max(P.cap,P.inv.length)}
function cnt(id){let n=0;for(const s of P.inv)if(s&&s.id===id)n+=s.n;return n}
function addItem(id,n){
  const it=IT[id];fixInv();
  for(const s of P.inv)if(s&&s.id===id&&s.n<it.st){const a=Math.min(n,it.st-s.n);s.n+=a;n-=a;if(!n)return 0}
  for(let i=0;i<P.cap&&n>0;i++)if(!P.inv[i]){const a=Math.min(n,it.st);P.inv[i]={id:id,n:a};n-=a}
  return n;
}
function removeItem(id,n){
  if(cnt(id)<n)return false;
  for(let i=P.inv.length-1;i>=0&&n>0;i--){const s=P.inv[i];if(s&&s.id===id){const a=Math.min(n,s.n);s.n-=a;n-=a;if(s.n<=0)P.inv[i]=null}}
  return true;
}
function popup(msg,col){
  const box=$('msgs');if(!box)return;const d=document.createElement('div');d.className='msg';d.textContent=msg;d.style.color=col||'#f2e8d0';box.appendChild(d);
  while(box.children.length>5)box.removeChild(box.firstChild);setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d)},2400);
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)}
function give(id,n){
  const left=addItem(id,n),it=IT[id];
  if(left>0)dropItem(id,left,P.x,P.y);
  popup(it.n.toUpperCase()+' +'+n,RCOL[it.r]);sfx('pickup');
}
function dropItem(id,n,x,y){A.drops.push({x:x,y:y,id:id,n:n,vx:rnd(-50,50),vy:rnd(-40,40),z:8,vz:rnd(90,150),t:0,life:600,ph:Math.random()*6});
  if(IT[id].r>=3){sfx('levelup')}}
function updateDrops(dt){
  const L=A.drops;
  for(let i=L.length-1;i>=0;i--){
    const d=L[i];d.t+=dt;d.life-=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;d.vz-=520*dt;if(d.z<0){d.z=0;d.vz*=-.35;d.vx*=.5;d.vy*=.5}
    if(blockedAt(d.x,d.y,3,true)){d.vx=d.vy=0}
    const dx=P.x-d.x,dy=P.y-d.y,dd=Math.hypot(dx,dy);
    if(d.t>.5&&dd<70&&!P.dead){d.x+=dx/dd*160*dt;d.y+=dy/dd*160*dt}
    if(d.t>.5&&dd<24&&!P.dead){
      const left=addItem(d.id,d.n);const got=d.n-left;
      if(got>0){popup(IT[d.id].n.toUpperCase()+' +'+got,RCOL[IT[d.id].r]);sfx('pickup');burst(d.x,d.y,5,RCOL[IT[d.id].r],70,.4,2,{glow:1})}
      if(left<=0){L.splice(i,1);continue}d.n=left;d.t=-2;
    }
    if(d.life<=0)L.splice(i,1);
  }
}
const FISTS={n:'Fists',wpn:{dmg:6,rng:40,cd:.45}};
function getWeapon(){
  const it=P.inv[P.sel];if(it&&IT[it.id].wpn)return IT[it.id];
  let best=null;for(const s of P.inv){if(s&&IT[s.id].wpn&&!IT[s.id].wpn.ranged&&(!best||IT[s.id].wpn.dmg>best.wpn.dmg))best=IT[s.id]}
  return best||FISTS;
}
const has=id=>cnt(id)>0;
function critChance(){return .05+(P.skills.crit||0)*.08}
function useItem(i){
  const s=P.inv[i];if(!s)return;const it=IT[s.id];let used=false;
  if(it.kit==='campfire'){closePanels();UI.build='campfire';popup('PLACE THE CAMPFIRE','#ffb640');return}
  if(it.armor){const old=P.armor;P.armor=s.id;P.inv[i]=old?{id:old,n:1}:null;popup('EQUIPPED '+it.n.toUpperCase(),RCOL[it.r]);sfx('craft');return}
  if(it.food!==undefined||it.heal||it.xp||it.water){
    if(it.food)P.hun=Math.min(100,P.hun+it.food);if(it.water)P.wat=Math.min(100,P.wat+it.water);
    if(it.heal)P.hp=Math.min(P.mhp,P.hp+it.heal);if(it.hp&&!it.heal)P.hp=Math.min(P.mhp,P.hp+it.hp);if(it.sta)P.sta=Math.min(100,P.sta+it.sta);
    if(it.xp)xpGain(it.xp);
    used=true;if(it.hp<0)sfx('hurt');else sfx('drink');ftext(P.x,P.y-30,it.food?'+'+it.food+' food':it.heal?'+'+it.heal+' HP':'+'+it.xp+' XP','#9f9',15);
  }
  if(used){s.n--;if(s.n<=0)P.inv[i]=null;if(P.hp<=0)die('Poisoned by raw meat.')}
}

/* ============================ XP / LEVEL / SKILLS ============================ */
const xpNeed=l=>60+l*45;
function recalc(){
  const S=P.skills,l=P.lvl-1;
  P.mhp=100+l*8+(S.hardy||0)*15;P.dmgM=1+l*.03+(S.brute||0)*.15;P.mineM=1+l*.04;P.spdM=1+l*.02+(S.fleet||0)*.06;P.atkM=1+(S.swift||0)*.12;
  const cap=Math.min(48,24+2*l);if(cap>P.cap){P.cap=cap;fixInv()}
}
function xpGain(n,x,y){
  if(P.dead)return;P.xp+=n;if(x!==undefined&&n>=3)ftext(x,y-28,'+'+Math.round(n)+' XP','#7fc8ff',13);
  while(P.xp>=xpNeed(P.lvl)){
    P.xp-=xpNeed(P.lvl);P.lvl++;P.sp++;recalc();P.hp=Math.min(P.mhp,P.hp+P.mhp*.3);
    sfx('levelup');popup('LEVEL UP!  LV '+P.lvl,'#ffd45a');popup('+8 HEALTH · +DAMAGE · +MINING · +SPEED · +2 SLOTS','#9fe0c8');
    burst(P.x,P.y,30,'#ffd45a',200,1,4,{glow:1,vz:140});
  }
}
function skillCost(){return 1}
function buySkill(id){
  if(P.sp<1||(P.skills[id]||0)>=3)return;P.skills[id]=(P.skills[id]||0)+1;P.sp--;recalc();sfx('craft');renderPanel();
}

/* ============================ CRAFTING ============================ */
function canCraft(r){for(const k in r.i)if(cnt(k)<r.i[k])return false;return true}
function craft(r){
  if(!canCraft(r)){toast('Missing materials');return}
  for(const k in r.i)removeItem(k,r.i[k]);
  const left=addItem(r.o,r.n);if(left>0)dropItem(r.o,left,P.x,P.y);
  ST.crafted[r.o]=true;sfx('craft');popup('CRAFTED: '+IT[r.o].n.toUpperCase(),RCOL[IT[r.o].r]);xpGain(8+IT[r.o].r*7);checkAch();renderPanel();
}

/* ============================ BUILDING ============================ */
function sKey(tx,ty){return ty*WW+tx}
function bpos(){
  let tx,ty;const zc=Z/DPR;
  if(mouse.used&&!UI.mobile&&performance.now()-mouse.t<5000){tx=Math.floor((cam.x+mouse.x/zc)/TS);ty=Math.floor((cam.y+mouse.y/zc)/TS)}
  else{tx=Math.floor((P.x+P.ax*38)/TS);ty=Math.floor((P.y+P.ay*38)/TS)}
  return{tx:tx,ty:ty};
}
function bcost(id){const b=BUILDS.find(x=>x.id===id);return b?b.c:{}}
function afford(id){
  if(id==='campfire'&&has('campfire'))return true;
  const c=bcost(id);for(const k in c)if(cnt(k)<c[k])return false;return true;
}
function canPlace(id,tx,ty){
  if(A!==AW)return false;
  const t=tileAt(tx,ty);if(SOLIDT[t]||t===T.SHAL||t===T.TEMPLE)return false;
  if(Math.hypot(tx*TS+16-P.x,ty*TS+16-P.y)>7*TS)return false;
  const e=W.sMap.get(sKey(tx,ty))||{};
  if(id==='floor')return !e.f;
  if(id==='roof')return !e.r;
  if(e.s)return false;
  const cx=tx*TS+16,cy=ty*TS+16;
  if(Math.abs(P.x-cx)<16+P.r&&Math.abs(P.y-cy)<16+P.r)return false;
  for(const s of nearStatics(cx,cy,40)){if(s.dead||s.k==='ent')continue;if(s.r>0&&Math.abs(s.x-cx)<16+s.r&&Math.abs(s.y-cy)<16+s.r)return false;if(s.box&&s.tx===tx&&s.ty===ty)return false}
  return true;
}
function payBuild(id){
  if(id==='campfire'&&has('campfire')){removeItem('campfire',1);return}
  const c=bcost(id);for(const k in c)removeItem(k,c[k]);
}
function place(id,tx,ty){
  if(!canPlace(id,tx,ty)){toast(afford(id)?'Cannot build here':'Not enough materials');sfx('ui');return}
  if(!afford(id)){toast('Not enough materials');return}
  payBuild(id);makeStructure(id,tx,ty,{});
  ST.built[id]=true;sfx('build');xpGain(5);burst(tx*TS+16,ty*TS+16,8,'#c9a26a',80,.4,3);
  if(!ST.base||id==='campfire'||id==='chest')ST.base={x:tx*TS+16,y:ty*TS+16};
  if(!afford(id))UI.build=null;
}
function makeStructure(id,tx,ty,o){
  const s={k:'st',t:id,x:tx*TS+16,y:ty*TS+16,tx:tx,ty:ty,r:0,hp:100};
  if(id==='wall'||id==='door'||id==='chest'||id==='tower')s.box=1;
  if(id==='campfire'){s.r=10;s.lit=o.lit!==false}
  if(id==='door')s.open=!!o.open;
  if(id==='chest')s.inv=o.inv||[];
  if(id==='tower')s.cd=0;
  addStatic(s);if(!W.built)W.built=[];W.built.push(s);
  const key=sKey(tx,ty);let e=W.sMap.get(key);if(!e){e={};W.sMap.set(key,e)}
  if(id==='floor')e.f=s;else if(id==='roof')e.r=s;else e.s=s;
  return s;
}
function removeStructure(s){
  const a=W.cells[cellOf(s.x,s.y)],i=a.indexOf(s);if(i>=0)a.splice(i,1);const j=W.all.indexOf(s);if(j>=0)W.all.splice(j,1);
  const k=W.built.indexOf(s);if(k>=0)W.built.splice(k,1);
  const e=W.sMap.get(sKey(s.tx,s.ty));if(e){if(e.f===s)e.f=null;if(e.r===s)e.r=null;if(e.s===s)e.s=null}
  const c=bcost(s.t);for(const kk in c){const n=Math.floor(c[kk]/2);if(n>0)dropItem(kk,n,s.x,s.y)}
  if(s.inv)for(const it of s.inv)dropItem(it.id,it.n,s.x,s.y);
  burst(s.x,s.y,10,'#c9a26a',100,.5,3);sfx('build');
}
function roofAt(x,y){if(A!==AW)return true;const e=W.sMap.get(sKey(Math.floor(x/TS),Math.floor(y/TS)));return !!(e&&e.r)}
function structAtPix(x,y){const tx=Math.floor(x/TS),ty=Math.floor(y/TS),e=W.sMap.get(sKey(tx,ty));return e?(e.s||e.r||e.f):null}

/* ============================ INTERACTION ============================ */
function hasTool(t){for(const s of P.inv)if(s&&IT[s.id].tool===t)return true;return false}
function findInteract(){
  let best=null,bd=1e9;
  const ns=nearStatics(P.x,P.y,70);
  for(const s of ns){
    if(s.dead)continue;const d=Math.hypot(s.x-P.x,s.y-P.y)-(s.r||0);let lab=null,kind=null,ok=true;
    if(s.k==='res'){
      const df=RES[s.t];if(d>26)continue;
      if(isTree(s.t)){if(s.fruit>0){kind='pick';lab='Pick Apples'}else{kind='chop';lab='Chop '+df.nm+(hasTool('axe')?'':' (slow)')}}
      else if(df.mine){kind='mine';lab='Mine '+df.nm;if(df.tier&&!hasTool('pick')){ok=false;lab='Needs a Pickaxe'}}
      else{kind='pick';lab='Gather '+df.nm}
    }else if(s.k==='st'){
      if(d>34)continue;
      if(s.t==='door'){kind='door';lab=s.open?'Close Door':'Open Door'}
      else if(s.t==='chest'){kind='schest';lab='Open Chest'}
      else if(s.t==='campfire'){kind='fire';lab=s.lit?(has('meat')?'Cook Meat':'Warm by the Fire'):'Relight Fire (1 wood)'}
    }else if(s.k==='lchest'){if(s.open||d>36)continue;kind='lchest';lab='Open Chest'}
    else if(s.k==='ent'){if(d>56)continue;kind='enter';lab='Enter '+DT[s.t].n}
    else if(s.k==='exit'){if(d>52)continue;kind='exit';lab='Leave the '+A.def.n}
    else if(s.k==='lockdoor'){if(d>50)continue;kind='lock';lab=has('key')?'Unlock Vault':'Sealed — needs an Ancient Key';ok=has('key')}
    else if(s.k==='secret'){if(d>48)continue;kind='secret';lab='Search Cracked Wall'}
    else if(s.k==='dec'&&s.t==='cfire'){if(d>34)continue;kind='fire2';lab=has('meat')?'Cook Meat':'Warm by the Fire'}
    if(!kind)continue;
    if(d<bd){bd=d;best={kind:kind,s:s,lab:lab,ok:ok}}
  }
  if(!best&&!A.isDun&&P.wat<99){
    const t=tileAt(Math.floor((P.x+P.ax*28)/TS),Math.floor((P.y+P.ay*28)/TS));
    if(t===T.SHAL||t===T.DEEP)best={kind:'drink',s:null,lab:'Drink Water',ok:true};
  }
  return best;
}
function startAct(type,s,dur,label){P.act={type:type,s:s,t:0,dur:dur,label:label}}
function interact(){
  if(P.act||P.dead)return;const n=P.near;if(!n)return;
  if(!n.ok){toast(n.lab);return}
  const s=n.s;
  switch(n.kind){
    case'chop':startAct('chop',s,hasTool('axe')?.42:.6,'CHOPPING...');break;
    case'mine':{const df=RES[s.t];startAct('mine',s,df.mine/(hasTool('pick')?2.2:1)/P.mineM,'MINING...');break}
    case'pick':startAct('pick',s,(RES[s.t]?RES[s.t].pick:0)||.8,'GATHERING...');break;
    case'door':s.open=!s.open;sfx('open');break;
    case'schest':UI.chest=s;openPanel('inv');sfx('open');break;
    case'fire':case'fire2':
      if(kindLit(s)){if(has('meat'))startAct('cook',s,2,'COOKING...');else toast('The fire crackles warmly')}
      else if(removeItem('wood',1)){s.lit=true;sfx('build');popup('FIRE LIT','#ff9a4a')}else toast('Need 1 wood');break;
    case'lchest':startAct('open',s,.7,'OPENING...');break;
    case'enter':enterDungeon(s);break;
    case'exit':exitDungeon();break;
    case'lock':
      if(removeItem('key',1)){for(const q of A.statics)if(q.k==='lockdoor')q.dead=true;ST.dun[A.type]=ST.dun[A.type]||{};ST.dun[A.type].vault=1;ST.vaults++;
        popup('VAULT OPENED','#ffb640');sfx('boom');shake(8);xpGain(150,P.x,P.y);burst(s.x,s.y,24,'#c9a26a',180,.7,4)}break;
    case'secret':s.dead=true;ST.dun[A.type]=ST.dun[A.type]||{};ST.dun[A.type].secret=1;popup('SECRET ROOM FOUND','#c07cff');shake(6);sfx('boom');xpGain(60,P.x,P.y);burst(s.x,s.y,18,'#a89f92',160,.6,3);break;
    case'drink':startAct('drink',null,1.1,'DRINKING...');break;
  }
}
function kindLit(s){return s.k==='dec'?true:!!s.lit}
function rollLoot(tier){
  const out=[],L=luck(),pools=[
   [['wood',4,8],['stone',3,7],['apple',2,4],['herb',2,4],['berries',2,5],['arrows',4,10]],
   [['rope',1,2],['coal',2,4],['leather',1,3],['bandage',1,2],['torch',1,3],['coin',2,5],['cooked',1,2],['log',1,3]],
   [['iron',2,4],['gold',1,3],['potion',1,1],['armor',1,1],['sword',1,1],['bow',1,1]],
   [['crystal',1,3],['relic',1,1],['crystalblade',1,1],['potion',2,2]],
   [['core',1,1],['guardblade',1,1]]];
  const roll=r=>{const p=pools[r],e=pick(p);out.push([e[0],rint(e[1],e[2])])};
  const rolls=[2,3,3,4][tier]||3;
  for(let i=0;i<rolls;i++){
    let r=0;const x=Math.random();
    if(tier===0)r=x<.5+ -L*.4?0:1;
    else if(tier===1)r=x<.35?0:x<.85-L?1:2;
    else if(tier===2)r=x<.2?1:x<.7-L?2:x<.9?3:2;
    else r=x<.3?2:3;
    roll(r);
  }
  if(tier>=2&&Math.random()<.04+L*.1+(tier===3?.25:0))roll(4);
  if(tier===3){roll(3)}
  const seen={};return out.filter(o=>{if(IT[o[0]].st===1&&seen[o[0]])return false;seen[o[0]]=1;return true});
}
function finishAct(a){
  const s=a.s;
  if(a.type==='mine'){
    const df=RES[s.t];let n=rint(df.y[1],df.y[2])+(hasTool('pick')&&df.tier!==undefined?1:0);if(Math.random()<luck())n++;
    give(df.y[0],n);xpGain(4+df.rar*6,s.x,s.y);
    if(s.t==='rock'){if(Math.random()<.1)give('coal',1);if(Math.random()<.03)give('iron',1)}
    s.dead=true;s.rt=110+Math.random()*120+df.rar*60;burst(s.x,s.y,14,'#9a9a94',120,.6,3);sfx('mine');
  }else if(a.type==='pick'){
    if(s.k==='res'&&isTree(s.t)&&s.fruit>0){s.fruit=0;s.ft=120;give('apple',rint(2,4));xpGain(3)}
    else{const df=RES[s.t];give(df.y[0],rint(df.y[1],df.y[2]));xpGain(2,s.x,s.y);s.dead=true;s.rt=90+Math.random()*80}
    burst(s.x,s.y,6,'#6aa84f',60,.4,2);
  }else if(a.type==='cook'){
    if(removeItem('meat',1)){give('cooked',1);xpGain(3);sfx('craft');burst(s.x,s.y,6,'#ff9a3c',60,.4,2,{glow:1})}
  }else if(a.type==='open'){
    s.open=true;ST.opened[s.id]=1;ST.chests++;sfx('open');xpGain(20+s.tier*15,s.x,s.y);checkAch();
    for(const l of rollLoot(s.tier))dropItem(l[0],l[1],s.x+rnd(-10,10),s.y+16);
    burst(s.x,s.y,14,'#ffd45a',120,.7,3,{glow:1});
  }else if(a.type==='drink'){
    P.wat=Math.min(100,P.wat+38);sfx('drink');burst(P.x+P.ax*24,P.y+P.ay*24,8,'#8cd0ff',60,.4,2)
  }
}
function updateAct(dt){
  const a=P.act;if(!a)return;
  if(P.moving||P.hurtT>.25){P.act=null;return}
  if(a.s&&a.s.dead){P.act=null;return}
  a.t+=dt;P.swing=Math.sin(a.t*14);
  if(a.type==='chop'){
    if(a.t>=a.dur){a.t=0;chopHit(a.s,hasTool('axe')?46:20);if(a.s.dead)P.act=null}
    return;
  }
  if(a.t>=a.dur){P.act=null;finishAct(a)}
  else if(a.type==='mine'&&Math.random()<dt*7){sfx('mine');spawnP(a.s.x+rnd(-8,8),a.s.y+rnd(-8,4),rnd(-50,50),rnd(-40,0),.35,2,'#ccc',{z:rnd(4,16),vz:60,g:300,glow:1})}
}
function chopHit(s,dmg){
  if(s.dead)return;s.hp-=dmg*P.dmgM;s.sh=.3;sfx('chop');
  for(let i=0;i<4;i++)spawnP(s.x+rnd(-6,6),s.y-10,rnd(-60,60),rnd(-30,30),.5,2.5,'#8a6238',{z:rnd(10,30),vz:80,g:300});
  if(s.t==='cactus'||s.t==='palm'||true){/* leaves */ if(Math.random()<.5)spawnP(s.x+rnd(-14,14),s.y-30,rnd(-20,20),rnd(-10,10),.9,3,'#5ea447',{z:rnd(30,40),vz:0,g:70})}
  if(s.hp<=0){
    const df=RES[s.t];s.dead=true;s.rt=150+Math.random()*150;
    (A.fall=A.fall||[]).push({x:s.x,y:s.y,t:0,tt:s.t,v:s.v,dir:P.x<s.x?1:-1});
    const n=rint(df.y[1],df.y[2])+(hasTool('axe')?1:0);popup('TREE DESTROYED','#c9e6a0');give(df.y[0],n);
    if(s.t!=='cactus'&&Math.random()<.3+luck())give('log',1);
    if(s.fruit>0){give('apple',rint(1,3));s.fruit=0}
    xpGain(6,s.x,s.y);P.act=null;
  }
}
function attackTrees(w,ang){

    if((s.t==='cfire'||s.t==='campfire'||s.t==='brazier')&&(s.lit||s.k==='dec')){const d=Math.hypot(s.x-P.x,s.y-P.y);if(d<150)h=Math.max(h,(1-d/150)*45)}
  }

function updateSurvival(dt){
  if(P.dead)return;const S=P.skills,tt=tileTypeAt(P.x,P.y),day=G.dark<.5;
  let hd=.12*(P.sprint?1.6:1)*(1-.15*(S.eater||0)),wd=.16*(P.sprint?1.8:1)*(1-.15*(S.water||0));
  if(P.temp>85)wd*=1.8;if(tt===T.DESERT&&day)wd*=1.4;

  if(P.sprint)P.sta=Math.max(0,P.sta-17*dt);

    target+=G.dark>.5?-22*G.dark:0;

    if(tt===T.DESERT)target+=day?26:-8;else if(tt===T.ROCK||tt===T.CLIFF)target-=14;else if(tt===T.VOLC||tt===T.TEMPLE)target+=32;else if(tt===T.SAND&&day)target+=5;
    if(roofAt(P.x,P.y)){target+=10+w.rain*10;}
  }

  if(P.poison>0){P.poison-=dt;P.hp-=2*dt;if(Math.random()<dt*4)spawnP(P.x+rnd(-6,6),P.y,0,0,.6,2.5,'#7fe04a',{z:rnd(8,26),vz:20,g:-10})}

    for(const n of nb){

      if(t<=T.SHAL&&nt<=T.SHAL)continue;const nc=TBASE[nt];

}

  g.imageSmoothingEnabled=false;g.fillStyle='#050a0a';g.fillRect(0,0,c.width,c.height);g.drawImage(W.mapImg,0,0,c.width,c.height);
  const cs=S*2;g.fillStyle='rgba(6,12,12,.96)';
  for(let y=0;y<80;y++)for(let x=0;x<80;x++)if(!explored[y*80+x])g.fillRect(x*cs,y*cs,cs+.5,cs+.5);

  g.font='16px serif';g.textAlign='center';g.textBaseline='middle';
  const rare={iron:'#e08a44',gold:'#ffd23a',crystal:'#c07cff'};
  for(const s of W.res){if(s.dead||!rare[s.t]||!ex(s.x,s.y))continue;g.fillStyle=rare[s.t];g.fillRect(px(s.x)-1.5,px(s.y)-1.5,3,3)}
  const sense=P.skills.sense||0;
  for(const s of W.lch){if(s.open)continue;if(ex(s.x,s.y)&&sense>0||(sense>0&&Math.hypot(s.x-P.x,s.y-P.y)<400+sense*350)){g.fillStyle='#ffe066';g.fillRect(px(s.x)-2,px(s.y)-2,4,4)}}
  for(const e of W.ents)if(ST.disc['e'+e.t])g.fillText(DT[e.t].ic,px(e.x),px(e.y));
  for(const c2 of W.camps)if(ST.disc['camp'+c2.i])g.fillText('🏕️',px(c2.x),px(c2.y));
  if(ST.disc.arena||ex(W.arena.x,W.arena.y)){g.font='22px serif';g.fillText('👑',px(W.arena.x),px(W.arena.y));g.font='16px serif'}
  if(ST.visited['Volcano']){g.fillStyle='#ffb27a';g.font='bold 11px sans-serif';g.fillText('VOLCANO',px(W.arena.x),px(W.arena.y)+20)}
  if(ST.visited['Mountains']){}
  if(ST.base)g.fillText('🏠',px(ST.base.x),px(ST.base.y));
  g.fillText('⛺',px(W.spawn.x),px(W.spawn.y));
  const pxx=px(P.x),pyy=px(P.y);g.fillStyle='#fff';g.beginPath();g.arc(pxx,pyy,6,0,TAU);g.fill();g.fillStyle='#e0402f';g.beginPath();g.arc(pxx,pyy,3.6,0,TAU);g.fill();
  $('maplegend').innerHTML='🔴 You · 🏠 Base · ⛺ Landing · 👑 Boss · 🏕️ Camp · '+Object.keys(DT).map(k=>DT[k].ic+' '+DT[k].n).join(' · ')+' · dots: iron/gold/crystal · Explored '+Math.round(G.expN/W.landCellsTotal*100)+'%';
}

/* ============================ SETTINGS / ACH ============================ */
function renderSettings(){
  const row=(l,v,id)=>'<div class="row"><span>'+l+'</span><button class="btn sm" data-s="'+id+'">'+v+'</button></div>';
  $('setbody').innerHTML=row('🔊 Sound effects',CFG.sound?'ON':'OFF','sound')+row('🎵 Music',CFG.music?'ON':'OFF','music')+
   '<div class="row"><span>Volume</span><input type="range" min="0" max="100" value="'+Math.round(CFG.vol*100)+'" id="volr"></div>'+
   row('📳 Screen shake',CFG.shake?'ON':'OFF','shake')+row('✨ Particles',CFG.parts==='high'?'HIGH':'LOW','parts')+row('📱 Touch controls',CFG.touch.toUpperCase(),'touch')+row('📊 FPS / debug panel',CFG.fps?'ON':'OFF','fps');
  $('volr').oninput=e=>{CFG.vol=e.target.value/100;setVol(CFG.vol);saveCfg()};
}
function applyCfg(){
  AU.on=CFG.sound;AU.music=CFG.music;setVol(CFG.vol);UI.mobile=CFG.touch==='on'||(CFG.touch==='auto'&&(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window&&innerWidth<1000));
  document.body.classList.toggle('touch',UI.mobile);$('fps').classList.toggle('hidden',!CFG.fps);
}
function renderAch(){
  $('achbody').innerHTML=ACH.map(a=>'<div class="ach '+(ACHS[a.id]?'':'lock')+'"><div class="i">'+a.i+'</div><div><b>'+a.n+'</b><div style="font-size:12px;color:#9bb2a9">'+a.d+'</div></div><div style="margin-left:auto">'+(ACHS[a.id]?'✅':'🔒')+'</div></div>').join('');
}

/* ============================ HUD ============================ */
let hotKey='';
function updateHUD(){
  const set=(id,v)=>{const e=$(id);if(e.textContent!==v)e.textContent=v};
  const w=(id,p)=>{$(id).style.width=clamp(p,0,100)+'%'};
  w('b_hp',P.hp/P.mhp*100);w('b_hun',P.hun);w('b_wat',P.wat);w('b_sta',P.sta);
  set('t_hp',Math.ceil(P.hp)+'/'+P.mhp);set('t_hun',Math.ceil(P.hun)+'/100');set('t_wat',Math.ceil(P.wat)+'/100');set('t_sta',Math.ceil(P.sta)+'/100');
  $('b_tmp').style.left='calc('+clamp(P.temp,0,100)+'% - 2px)';set('t_tmp',P.temp<25?'COLD':P.temp>85?'HOT':'OK');
  set('t_lv',P.lvl);w('b_xp',P.xp/xpNeed(P.lvl)*100);set('t_xp',Math.floor(P.xp)+'/'+xpNeed(P.lvl));
  const sp=$('sp');sp.classList.toggle('hidden',P.sp<1);if(P.sp>0)sp.textContent='★ '+P.sp+' skill point'+(P.sp>1?'s':'')+' — press K';
  const h=G.tod*24,hh=Math.floor(h),mm=Math.floor((h-hh)*60);
  set('t_day','DAY '+G.day);set('t_time',String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'));
  set('t_wx',(G.wx.cur==='sunny'?(G.dark>.5?'🌙 Clear':'☀️ Sunny'):G.wx.cur==='rain'?'🌧️ Rain':G.wx.cur==='storm'?'⛈️ Storm':'🌫️ Fog'));
  set('t_loc',A.isDun?A.def.n:TNAME[tileAt(Math.floor(P.x/TS),Math.floor(P.y/TS))]);
  const q=QUESTS[ST.qi];$('quest').innerHTML=q?'<b>MISSION '+(ST.qi+1)+'/'+QUESTS.length+'</b>'+q.t:'<b>ALL MISSIONS DONE</b>Enjoy the island!';
  const pr=$('prompt'),n=P.near;
  if(UI.build&&G.state==='play'){pr.classList.remove('hidden');pr.textContent=UI.build==='remove'?'Click a structure to dismantle · Esc to stop':'Click / E to place · Esc to cancel'}
  else if(n&&!P.act&&G.state==='play'){pr.classList.remove('hidden');pr.textContent=(UI.mobile?'✋ ':'E · ')+n.lab;pr.style.color=n.ok?'':'#ff8a8a'}
  else pr.classList.add('hidden');
  const pg=$('prog');if(P.act){pg.classList.remove('hidden');set('prog_t',P.act.label);$('prog_b').style.width=(P.act.type==='chop'?(1-P.act.s.hp/P.act.s.mhp):P.act.t/P.act.dur)*100+'%'}else pg.classList.add('hidden');
  const b=G.boss,bs=$('boss');
  if(b&&b.active&&!A.isDun&&!(b.dead&&b.deadT>4)){bs.classList.remove('hidden');$('boss_b').style.width=clamp(b.hp/b.mhp*100,0,100)+'%'}else bs.classList.add('hidden');
  const it=P.inv[P.sel];set('sel',it?IT[it.id].i+' '+IT[it.id].n+(it.n>1?' x'+it.n:''):'Empty hands');$('sel').style.color=it?RCOL[IT[it.id].r]:'';
  let k=P.sel+'|';let hb='';for(let i=0;i<8;i++){const s=P.inv[i];k+=s?s.id+s.n:'-';hb+='<div class="hs'+(i===P.sel?' on':'')+'" data-h="'+i+'"><small>'+(i+1)+'</small>'+(s?IT[s.id].i+(s.n>1?'<em>'+s.n+'</em>':''):'')+'</div>'}
  if(k!==hotKey){hotKey=k;$('hotbar').innerHTML=hb}
  $('tplace').classList.toggle('hidden',!(UI.build&&UI.mobile));
}

/* ============================ INPUT HANDLING ============================ */
function handleKeys(){
  const p=pressed;
  if(p.Escape){
    if(G.state==='intro')endIntro();
    else if(UI.open==='panel'||UI.open==='map'){closePanels()}
    else if(UI.build){UI.build=null}
    else if(G.state==='play')pauseGame();
    else if(G.state==='paused'&&!$('pause').classList.contains('hidden'))resumeGame();
    else if(!$('settings').classList.contains('hidden')){}
  }
  if(G.state==='intro'){if(p.Space||p.Enter)endIntro();return}
  if(G.state!=='play'&&G.state!=='paused')return;
  const tog=(code,tab)=>{if(p[code]){if(UI.open==='panel'&&UI.tab===tab)closePanels();else if(G.state==='play'||UI.open==='panel'){if(UI.open==='map')closePanels();openPanel(tab)}}};
  tog('KeyI','inv');tog('KeyC','craft');tog('KeyB','build');tog('KeyK','skills');tog('KeyJ','journal');
  if(p.KeyM){if(UI.open==='map')closePanels();else if(G.state==='play')openMap()}
  if(G.state!=='play')return;
  for(let i=0;i<8;i++)if(p['Digit'+(i+1)])P.sel=i;
  if(p.KeyE||p.Enter){if(UI.build){bplace()}else interact()}
  if(p.KeyP&&UI.build)bplace();
  if(p.KeyF)doAttack(P.aa=aimAngle(false));
  if(p.KeyR||p.KeyQ){const s=P.inv[P.sel];if(s)useItem(P.sel)}
  if(keys.KeyF&&P.atkCD<=0)doAttack(P.aa=aimAngle(false));
  if(mouse.down&&!UI.build&&P.atkCD<=0&&mouse.canvas)doAttack(P.aa=aimAngle(true));
}
function aimAngle(useMouse){
  if(useMouse&&mouse.used){const zc=Z/DPR;return Math.atan2(cam.y+mouse.y/zc-P.y,cam.x+mouse.x/zc-P.x)}
  return Math.atan2(P.ay||0,P.ax||P.fx);
}
function bplace(){
  const id=UI.build;if(!id)return;const bp=bpos();
  if(id==='remove'){const s=structAtPix(bp.tx*TS+16,bp.ty*TS+16);if(s&&Math.hypot(s.x-P.x,s.y-P.y)<8*TS){removeStructure(s)}else toast('Nothing to dismantle');return}
  place(id,bp.tx,bp.ty);
}

/* ============================ MAIN LOOP ============================ */
let last=performance.now(),fpsT=0,fpsN=0,fps=60,qT=0,expT=0,saveT=0;
function updateTraps(dt){
  A.t+=dt;
  for(const s of A.statics){if(s.k!=='trap')continue;const c=(A.t+s.ph)%3;
    if(c>2.1&&P.z<8&&Math.abs(P.x-s.x)<13&&Math.abs(P.y-s.y)<13)hurtPlayer(12,s.x,s.y)}
}
function updateCam(dt){
  const k=1-Math.pow(.0005,dt),tx=P.x-VW/2,ty=P.y-VH/2-10;
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  if(!A.isDun){cam.x=clamp(cam.x,-80,WW*TS-VW+80);cam.y=clamp(cam.y,-80,WH*TS-VH+80)}
}
function update(dt){
  if(G.state==='menu'){
    const t=performance.now()/1000;cam.x=W.spawn.x-VW/2+Math.sin(t*.05)*500-200;cam.y=W.spawn.y-VH/2-300+Math.cos(t*.04)*260;
    G.cloud+=dt;updateFx(dt);for(const m of A.mobs)if(Math.hypot(m.x-cam.x-VW/2,m.y-cam.y-VH/2)<900&&m.def.beh!=='boss')updateMob(m,dt);return;
  }
  if(G.state==='intro'){updateIntro(dt);G.cloud+=dt;updateFx(dt);updateCam(dt);return}
  if(G.state!=='play'){updateFx(dt*.2);return}
  updateTime(dt);updatePlayer(dt);updateSurvival(dt);updateMobs(dt);updateSpawns(dt);updateProj(dt);updateWarn(dt);updateDrops(dt);updateStructures(dt);updateFx(dt);
  if(A.isDun)updateTraps(dt);
  if(A.fall){for(let i=A.fall.length-1;i>=0;i--){A.fall[i].t+=dt;if(A.fall[i].t>1.1)A.fall.splice(i,1)}}
  qT+=dt;if(qT>.5){qT=0;updateQuest();checkAch()}
  expT+=dt;if(expT>.4){expT=0;updateExplore()}
  saveT+=dt;if(saveT>45){saveT=0;autosave(true)}
  updateCam(dt);musicUpdate(dt);
  if(!P.dead&&P.hp<P.mhp*.3&&Math.random()<dt*.6)sfx('step');
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;if(dt<=0)return;
  fpsT+=dt;fpsN++;if(fpsT>=.5){fps=fpsN/fpsT;fpsT=0;fpsN=0;if(CFG.fps)$('fps').textContent='FPS '+fps.toFixed(0)+'\nMobs '+A.mobs.length+'  Particles '+parts.filter(p=>p.on).length+'\nChunks '+W.chunks.size+'  Statics '+(A.isDun?A.statics.length:W.all.length)}
  try{
    if(G.state!=='menu')handleKeys();
    update(dt);
    if(G.state==='menu'||G.state==='intro'||G.state==='play'||G.state==='paused'||G.state==='over'||G.state==='win')render();
    G.hudT+=dt;if(G.hudT>.08&&G.state!=='menu'&&G.state!=='intro'){G.hudT=0;updateHUD()}
  }catch(e){console.error(e);if(!frame.err){frame.err=1;toast('Error: '+e.message)}}
  for(const k in pressed)pressed[k]=false;mouse.clicked=false;
}

/* ============================ INIT ============================ */
function init(){
  try{Object.assign(CFG,JSON.parse(localStorage.getItem('wildcraft_cfg')||'{}'))}catch(e){}
  try{ACHS=JSON.parse(localStorage.getItem('wildcraft_ach')||'{}')}catch(e){ACHS={}}
  CFG.vol=clamp(+CFG.vol||0,0,1);applyCfg();bindTouch();resize();
  const on=(id,f)=>$(id).addEventListener('click',()=>{auInit();sfx('ui');f()});
  on('m_new',beginNew);on('m_cont',continueGame);on('m_set',()=>{UI.setFrom='menu';renderSettings();showScr('settings')});
  on('m_ach',()=>{UI.setFrom='menu';renderAch();showScr('ach')});on('m_exit',()=>{try{window.close()}catch(e){}showScr('bye')});
  on('b_back',()=>showScr('menu'));on('a_back',()=>{showScr(UI.setFrom==='pause'?'pause':'menu')});
  on('s_back',()=>{saveCfg();applyCfg();showScr(UI.setFrom==='pause'?'pause':'menu')});
  on('p_res',resumeGame);on('p_inv',()=>{G.state='play';openPanel('inv')});on('p_craft',()=>{G.state='play';openPanel('craft')});
  on('p_set',()=>{UI.setFrom='pause';renderSettings();showScr('settings')});on('p_save',()=>{autosave(false);toast('💾 GAME SAVED')});on('p_menu',()=>{toMenu()});
  on('pclose',closePanels);on('mclose',closePanels);on('skip',endIntro);
  on('o_load',()=>{if(hasSave())continueGame();else beginNew()});on('o_new',beginNew);on('o_menu',toMenu);
  on('w_cont',()=>{hideScr();G.state='play'});on('w_menu',toMenu);
  $('pbody').addEventListener('click',panelClick);$('tabs').addEventListener('click',panelClick);
  $('setbody').addEventListener('click',e=>{const t=e.target.closest('[data-s]');if(!t)return;const s=t.dataset.s;
    if(s==='touch')CFG.touch=CFG.touch==='auto'?'on':CFG.touch==='on'?'off':'auto';else if(s==='parts')CFG.parts=CFG.parts==='high'?'low':'high';else CFG[s]=!CFG[s];
    saveCfg();applyCfg();renderSettings()});
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const o=b.dataset.open;auInit();
    if(G.state!=='play'&&G.state!=='paused')return;if(o==='pause')pauseGame();else if(o==='map')UI.open==='map'?closePanels():openMap();else if(UI.open==='panel'&&UI.tab===o)closePanels();else{if(UI.open==='map')closePanels();openPanel(o)}}));
  $('hotbar').addEventListener('pointerdown',e=>{const h=e.target.closest('[data-h]');if(!h||G.state!=='play')return;const i=+h.dataset.h;if(P.sel===i&&P.inv[i])useItem(i);P.sel=i});
  cvs.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.used=true;mouse.t=performance.now()});
  cvs.addEventListener('mousedown',e=>{if(e.button!==0)return;auInit();mouse.down=true;mouse.canvas=true;mouse.x=e.clientX;mouse.y=e.clientY;mouse.used=true;mouse.t=performance.now();
    if(G.state==='play'&&UI.build)bplace()});
  addEventListener('mouseup',()=>{mouse.down=false;mouse.canvas=false});
  cvs.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')pauseGame()});
  addEventListener('beforeunload',()=>{if(G.state==='play')autosave(true)});
  toMenu();requestAnimationFrame(frame);
}
init();

</script>
